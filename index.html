<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 校曆與月檢視 - 2026-2027 Dashboard</title>

  <!-- PapaParse 用於解析 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --border-color: #cbd5e1;
      --header-bg: #1e293b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      margin: 0;
      padding: 8px;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    /* 頁籤導覽列 */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-btn {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 6px;
      text-decoration: none;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .nav-btn:hover { background: #cbd5e1; }
    .nav-btn.active { background: var(--primary-color); color: #ffffff; }

    /* 月曆頂部控制欄 */
    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-month {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-month:hover { background-color: #1d4ed8; }

    #monthSelect {
      padding: 6px 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      cursor: pointer;
    }

    /* 圖例 Legend */
    .legend-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag-badge {
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .badge-cycle { background: #2563eb; color: #fff; }
    .badge-holiday { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }
    .badge-activity { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }

    /* 日曆主網格 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background-color: #cbd5e1; /* 作為格線顏色 */
      gap: 1px;
    }

    /* 星期標題 Header */
    .calendar-header-day {
      background-color: var(--header-bg);
      color: #ffffff;
      text-align: center;
      padding: 8px 0;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* 日期格子 Body Cell */
    .day-cell {
      background-color: #f0f4f8; /* 預設淡藍底色 (如圖片) */
      min-height: 100px;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .day-cell.other-month {
      background-color: #cbd5e1; /* 非本月填滿灰色 (如圖片底部) */
      opacity: 0.6;
    }

    .day-number {
      font-weight: bold;
      font-size: 0.95rem;
      color: #0f172a;
    }

    /* 今天的高亮 */
    .day-cell.is-today {
      background-color: #e0f2fe;
      outline: 2px solid #0284c7;
      outline-offset: -2px;
    }

    /* 日曆內的事件卡片標籤 */
    .event-tag {
      font-size: 0.75rem;
      padding: 3px 5px;
      border-radius: 4px;
      line-height: 1.2;
      word-break: break-all;
    }

    .event-cycle {
      background-color: #eff6ff;
      color: #1d4ed8;
      border-left: 3px solid #2563eb;
      font-weight: bold;
    }

    .event-holiday {
      background-color: #ffe4e6;
      color: #9f1239;
      border-left: 3px solid #f43f5e;
      font-weight: bold;
    }

    .event-activity {
      background-color: #fef3c7;
      color: #92400e;
      border-left: 3px solid #f59e0b;
      font-weight: bold;
    }

    #loading {
      font-size: 0.88rem;
      color: #0284c7;
      font-weight: bold;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 導覽選單 -->
    <div class="nav-tabs">
      <a href="index.html" class="nav-btn active">📊 校曆與月檢視</a>
      <a href="week.html" class="nav-btn">🗓️ 週安排檢視</a>
      <a href="timetable.html" class="nav-btn">📅 課堂時間表</a>
      <a href="math.html" class="nav-btn">📐 數學日誌</a>
      <a href="sow.html" class="nav-btn">📘 教學計劃 SOW</a>
      <a href="ft.html" class="nav-btn">🏫 班主任事務</a>
    </div>

    <!-- 月份控制項 (與圖片樣式一致) -->
    <div class="calendar-controls">
      <button class="btn-month" onclick="changeMonth(-1)">◀ 上一個月</button>
      <select id="monthSelect" onchange="onMonthSelectChange()"></select>
      <button class="btn-month" onclick="changeMonth(1)">下一個月 ▶</button>
    </div>

    <!-- 圖例 Legend -->
    <div class="legend-container">
      <div class="legend-item">
        <span class="tag-badge badge-cycle">A-F</span> 循環日
      </div>
      <div class="legend-item">
        <span class="tag-badge badge-holiday">假期</span> 學校假期
      </div>
      <div class="legend-item">
        <span class="tag-badge badge-activity">活動</span> 特別活動
      </div>
    </div>

    <div id="loading">⏳ 正在載入校曆資料中...</div>

    <!-- 月曆容器 -->
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>

  <script>
    const CSV_URL = 'Sch Calendar-Grid view.csv';
    let calendarData = {}; // key: YYYY-MM-DD
    let availableMonths = []; // 儲存 CSV 內出現的所有年月 (例: ["2026-08", "2026-09"...])
    let currentYearMonth = ''; // 當前選擇的 "YYYY-MM"

    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          processData(results.data);
          document.getElementById('loading').style.display = 'none';
        },
        error: (err) => {
          document.getElementById('loading').textContent = '❌ 載入資料失敗，請確認 CSV 檔案是否存在。';
          console.error(err);
        }
      });
    });

    function processData(rows) {
      const monthSet = new Set();

      rows.forEach(row => {
        if (!row.Date) return;

        // 解析 DD/MM/YYYY -> YYYY-MM-DD
        const parts = row.Date.split('/');
        if (parts.length === 3) {
          const formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          const ym = `${parts[2]}-${parts[1].padStart(2, '0')}`;

          calendarData[formattedDate] = {
            cycleDay: row['Cycle Day'] || '',
            holiday: row['Sch Holiday/Special Sch Day'] || '',
            activity: row['Special Activity'] || ''
          };

          monthSet.add(ym);
        }
      });

      availableMonths = Array.from(monthSet).sort();

      // 初始化下拉選單
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      availableMonths.forEach(ym => {
        const [y, m] = ym.split('-');
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `${y} 年 ${parseInt(m, 10)} 月`;
        select.appendChild(opt);
      });

      // 預設選取「今天」所在的月份，若不在範圍內則預設第一個月份
      const todayYM = new Date().toISOString().substring(0, 7);
      if (availableMonths.includes(todayYM)) {
        currentYearMonth = todayYM;
      } else if (availableMonths.length > 0) {
        currentYearMonth = availableMonths[0];
      }

      select.value = currentYearMonth;
      renderCalendar(currentYearMonth);
    }

    function renderCalendar(ym) {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      if (!ym) return;

      const [year, month] = ym.split('-').map(Number);

      // 1. 渲染星期表頭 (日, 一, 二, 三, 四, 五, 六)
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      weekDays.forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-header-day';
        header.textContent = day;
        grid.appendChild(header);
      });

      // 2. 計算本月第一天是星期幾 & 本月總天數
      const firstDayOfMonth = new Date(year, month - 1, 1);
      const startingDayOfWeek = firstDayOfMonth.getDay(); // 0(日) - 6(六)
      const daysInMonth = new Date(year, month, 0).getDate();

      const todayStr = new Date().toISOString().split('T')[0];

      // 3. 填補月份開頭的空白格子
      for (let i = 0; i < startingDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell other-month';
        grid.appendChild(emptyCell);
      }

      // 4. 渲染本月的每一天
      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = String(day).padStart(2, '0');
        const monthStr = String(month).padStart(2, '0');
        const fullDateStr = `${year}-${monthStr}-${dayStr}`;

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (fullDateStr === todayStr) {
          cell.classList.add('is-today');
        }

        let cellContent = `<div class="day-number">${day}</div>`;

        // 如果這一天有校曆資料，顯示標籤
        const data = calendarData[fullDateStr];
        if (data) {
          // 循環日 Cycle Day
          if (data.cycleDay && data.cycleDay !== '-' && data.cycleDay.toLowerCase() !== 'null') {
            cellContent += `<div class="event-tag event-cycle">🔄 ${data.cycleDay}</div>`;
          }
          // 學校假期
          if (data.holiday) {
            cellContent += `<div class="event-tag event-holiday">🚩 ${data.holiday}</div>`;
          }
          // 特別活動
          if (data.activity) {
            cellContent += `<div class="event-tag event-activity">⭐ ${data.activity}</div>`;
          }
        }

        cell.innerHTML = cellContent;
        grid.appendChild(cell);
      }

      // 5. 填補月份結尾的空白格子，使其保持完整的列數
      const totalRendered = startingDayOfWeek + daysInMonth;
      const remainingCells = (7 - (totalRendered % 7)) % 7;
      for (let i = 0; i < remainingCells; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell other-month';
        grid.appendChild(emptyCell);
      }
    }

    function onMonthSelectChange() {
      currentYearMonth = document.getElementById('monthSelect').value;
      renderCalendar(currentYearMonth);
    }

    function changeMonth(delta) {
      const idx = availableMonths.indexOf(currentYearMonth);
      if (idx !== -1) {
        const newIdx = idx + delta;
        if (newIdx >= 0 && newIdx < availableMonths.length) {
          currentYearMonth = availableMonths[newIdx];
          document.getElementById('monthSelect').value = currentYearMonth;
          renderCalendar(currentYearMonth);
        }
      }
    }
  </script>
</body>
</html>
