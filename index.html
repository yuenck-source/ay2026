<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學週與每日課堂時間表系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { margin-bottom: 25px; border-bottom: 3px solid var(--secondary-color); padding-bottom: 10px; }
        h1 { color: var(--primary-color); font-size: 1.8rem; }
        .subtitle { color: #666; font-size: 0.95rem; margin-top: 5px; }

        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .control-card { background: var(--card-bg); padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .control-card label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary-color); }
        .control-card input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem; }

        .today-card { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .today-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 12px; margin-bottom: 15px; }
        .today-date { font-size: 1.3rem; font-weight: bold; }
        .cycle-badge { background-color: var(--secondary-color); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 15px; }
        .lesson-item { background: rgba(255, 255, 255, 0.15); border-left: 4px solid var(--secondary-color); padding: 10px 14px; border-radius: 4px; backdrop-filter: blur(5px); }
        .lesson-time { font-size: 0.8rem; color: #bdc3c7; margin-bottom: 4px; }
        .lesson-main { font-size: 1.05rem; font-weight: bold; }
        .lesson-room { font-size: 0.85rem; color: #ecf0f1; margin-top: 3px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background-color: #e0e0e0; color: #333; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background-color: var(--secondary-color); color: white; }
        .tab-content { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8f9fa; color: var(--primary-color); font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <header>
        <h1>校曆與每日教學課表管理系統</h1>
        <div class="subtitle">自動結合教學週、循環日 (Cycle Day) 與每堂班別時間表</div>
    </header>

    <div class="controls">
        <div class="control-card">
            <label for="datePicker">選擇檢視日期：</label>
            <input type="date" id="datePicker">
        </div>
        <div class="control-card">
            <label>資料同步狀態：</label>
            <div id="statusText" style="color: #e67e22; font-weight: bold; padding-top: 5px;">
                ⏳ 正在載入表格資料...
            </div>
        </div>
    </div>

    <!-- 當日課堂焦點 -->
    <div class="today-card">
        <div class="today-header">
            <div>
                <span class="today-date" id="displayDate">----年--月--日</span>
                <span style="font-size:0.9rem; margin-left:10px; opacity:0.8;" id="displayWeek">第 - 週</span>
            </div>
            <div class="cycle-badge" id="displayCycle">Day -</div>
        </div>

        <div>
            <div style="font-weight: bold; margin-bottom: 8px;">📌 當日課節安排 (Lessons Schedule)：</div>
            <div class="lessons-grid" id="lessonsContainer">
                <!-- 動態載入課節 -->
            </div>
        </div>
    </div>

    <!-- 分頁選單 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('timetableTab')">📅 循環日課堂時間表 (Timetable)</button>
        <button class="tab-btn" onclick="switchTab('calendarTab')">🗓️ 校曆教學週資料 (Calendar)</button>
    </div>

    <div id="timetableTab" class="tab-content active">
        <h2>課堂時間表總覽</h2>
        <table>
            <thead>
                <tr><th>循環日</th><th>課節</th><th>時間</th><th>班別</th><th>科目</th><th>地點</th></tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

    <div id="calendarTab" class="tab-content">
        <h2>校曆教學週總覽</h2>
        <table>
            <thead>
                <tr><th>日期</th><th>星期</th><th>教學週</th><th>循環日</th><th>活動/備註</th></tr>
            </thead>
            <tbody id="calendarBody"></tbody>
        </table>
    </div>

    <script>
        // 🔗 請將您的 Google Sheet 發佈為 Web 應用程式 (Apps Script URL) 或 CSV API 網址填在此處
        const GOOGLE_SCRIPT_URL = "您的_GOOGLE_APPS_SCRIPT_URL";

        let calendarData = [];
        let timetableData = [];

        const datePicker = document.getElementById('datePicker');

        window.onload = () => {
            // 設定預設日期為今天
            const today = new Date().toISOString().split('T')[0];
            datePicker.value = today;

            fetchSheetData(today);

            datePicker.addEventListener('change', (e) => {
                updateTodayView(e.target.value);
            });
        };

        // 從 Google Sheet 抓取資料
        function fetchSheetData(selectedDate) {
            if (GOOGLE_SCRIPT_URL === "您的_GOOGLE_APPS_SCRIPT_URL") {
                document.getElementById('statusText').innerHTML = "⚠️ 請設定 Google Sheet 連結 (目前使用預設展示模式)";
                document.getElementById('statusText').style.color = "#d35400";
                loadMockData(selectedDate);
                return;
            }

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    calendarData = data.calendar || [];
                    timetableData = data.timetable || [];
                    document.getElementById('statusText').innerHTML = "● 資料已同步完成";
                    document.getElementById('statusText').style.color = "#27ae60";
                    renderTables();
                    updateTodayView(selectedDate);
                })
                .catch(err => {
                    document.getElementById('statusText').innerHTML = "❌ 讀取失敗，請確認 Google Sheet 權限";
                    document.getElementById('statusText').style.color = "#c0392b";
                });
        }

        function updateTodayView(dateStr) {
            const calItem = calendarData.find(item => item.date === dateStr);

            if (calItem) {
                document.getElementById('displayDate').textContent = `${calItem.date} (星期${calItem.dayOfWeek || ''})`;
                document.getElementById('displayWeek').textContent = calItem.week || '';
                document.getElementById('displayCycle').textContent = calItem.cycle || '無';

                const todaysLessons = timetableData.filter(t => t.cycle === calItem.cycle);
                renderLessons(todaysLessons);
            } else {
                document.getElementById('displayDate').textContent = dateStr;
                document.getElementById('displayWeek').textContent = "非教學日 / 假日";
                document.getElementById('displayCycle').textContent = "-";
                document.getElementById('lessonsContainer').innerHTML = '<div style="opacity:0.7;">當天沒有排定的課節資訊。</div>';
            }
        }

        function renderLessons(lessons) {
            const container = document.getElementById('lessonsContainer');
            if (!lessons || lessons.length === 0) {
                container.innerHTML = '<div style="opacity: 0.7;">當天無課 (空堂 / 活動日)</div>';
                return;
            }

            container.innerHTML = lessons.map(l => `
                <div class="lesson-item">
                    <div class="lesson-time">${l.period} ${l.time ? '(' + l.time + ')' : ''}</div>
                    <div class="lesson-main">${l.className} - ${l.subject}</div>
                    <div class="lesson-room">📍 ${l.room || '課室'}</div>
                </div>
            `).join('');
        }

        function renderTables() {
            document.getElementById('timetableBody').innerHTML = timetableData.map(t => `
                <tr>
                    <td><strong>${t.cycle}</strong></td>
                    <td>${t.period}</td>
                    <td>${t.time || '-'}</td>
                    <td><span style="color:var(--secondary-color); font-weight:bold;">${t.className}</span></td>
                    <td>${t.subject}</td>
                    <td>${t.room || '-'}</td>
                </tr>
            `).join('');

            document.getElementById('calendarBody').innerHTML = calendarData.map(c => `
                <tr>
                    <td>${c.date}</td>
                    <td>星期${c.dayOfWeek || ''}</td>
                    <td>${c.week}</td>
                    <td><strong>${c.cycle}</strong></td>
                    <td>${c.event || '-'}</td>
                </tr>
            `).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 預設示範數據 (未連結 Google Sheet 時顯示)
        function loadMockData(date) {
            calendarData = [
                { date: date, week: "第 1 週", dayOfWeek: "二", cycle: "Day A", event: "開學禮" }
            ];
            timetableData = [
                { cycle: "Day A", period: "第 1 堂", time: "08:45 - 09:25", className: "3A", subject: "數學", room: "3A 課室" },
                { cycle: "Day A", period: "第 3 堂", time: "10:10 - 10:50", className: "4B", subject: "數學", room: "專科室" }
            ];
            renderTables();
            updateTodayView(date);
        }
    </script>
</body>
</html>
