<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 校曆與月檢視 - 2026-2027 Dashboard</title>

  <!-- PapaParse 用於解析 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --daily-color: #6366f1;
      --timetable-color: #0284c7;
      --pm-timetable-color: #0d9488;
      --duty-color: #ea580c;
      --bg-color: #f8fafc;
      --border-color: #cbd5e1;
      --header-bg: #1e293b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      margin: 0;
      padding: 8px;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    /* 頁籤導覽列 */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-btn {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 6px;
      text-decoration: none;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { background: #cbd5e1; }
    .nav-btn.active { background: var(--primary-color); color: #ffffff; }

    /* 今日安排區塊 (Today Schedule) */
    .today-box {
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .today-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #93c5fd;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .today-title {
      font-size: 1rem;
      font-weight: bold;
      color: #0369a1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .today-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    .today-card {
      background: #ffffff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      border-left: 3px solid var(--primary-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .today-card.duty { border-left-color: var(--duty-color); background-color: #fff7ed; }
    .today-card.morning { border-left-color: #f97316; background-color: #fff7ed; }

    /* 今日 Daily Log 區塊 */
    .daily-box {
      background-color: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .daily-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #a5b4fc;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .daily-title {
      font-size: 1rem;
      font-weight: bold;
      color: #3730a3;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .daily-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .daily-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .daily-item.done {
      background: #f8fafc;
      opacity: 0.7;
    }

    .daily-item.done .daily-text {
      text-decoration: line-through;
      color: #64748b;
    }

    .status-btn {
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .status-btn.todo { background: #fee2e2; color: #dc2626; }
    .status-btn.done { background: #dcfce7; color: #15803d; }

    /* 月曆控制項 */
    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-month {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #monthSelect {
      padding: 6px 10px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #fff;
    }

    /* 圖例 Legend */
    .legend-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }

    .tag-badge {
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-cycle { background: #2563eb; color: #fff; }
    .badge-holiday { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }
    .badge-activity { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }

    /* 桌面端：網格樣式 Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background-color: #cbd5e1;
      gap: 1px;
    }

    .calendar-header-day {
      background-color: var(--header-bg);
      color: #ffffff;
      text-align: center;
      padding: 8px 0;
      font-weight: bold;
      font-size: 0.88rem;
    }

    .day-cell {
      background-color: #ffffff;
      min-height: 95px;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .day-cell.other-month { background-color: #f1f5f9; opacity: 0.6; }
    .day-cell.is-today { background-color: #e0f2fe; outline: 2px solid #0284c7; outline-offset: -2px; }

    .day-number { font-weight: bold; font-size: 0.88rem; color: #0f172a; }

    .event-tag {
      font-size: 0.72rem;
      padding: 3px 5px;
      border-radius: 4px;
      line-height: 1.2;
    }

    .event-cycle { background-color: #eff6ff; color: #1d4ed8; border-left: 3px solid #2563eb; font-weight: bold; }
    .event-holiday { background-color: #ffe4e6; color: #9f1239; border-left: 3px solid #f43f5e; font-weight: bold; }
    .event-activity { background-color: #fef3c7; color: #92400e; border-left: 3px solid #f59e0b; font-weight: bold; }

    /* 手機端：清單樣式 List (預設隱藏) */
    .calendar-list {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .list-day-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .list-day-card.is-today {
      border-color: #0284c7;
      background-color: #f0f9ff;
    }

    .list-day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.9rem;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 4px;
    }

    .list-day-events {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* RWD 手機優化 */
    @media (max-width: 639px) {
      .calendar-grid { display: none; }
      .calendar-list { display: flex; }
    }

    #loading { font-size: 0.88rem; color: #0284c7; font-weight: bold; padding: 12px 0; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 導覽選單 -->
    <div class="nav-tabs">
      <a href="index.html" class="nav-btn">📊 今天事項及月曆</a>
      <a href="week.html" class="nav-btn">🗓️ 週安排檢視</a>
      <a href="timetable.html" class="nav-btn">📅 課堂時間表</a>
      <a href="daily.html" class="nav-btn">🏫 Daily Log</a>
      <a href="monthly.html" class="nav-btn">🗓️ Monthly Log</a>
      <a href="math.html" class="nav-btn">📐 數學日誌</a>
      <a href="sow.html" class="nav-btn">📘 教學計劃 SOW</a>
      <a href="ft.html" class="nav-btn">🏫 班主任事務</a>
      <a href="habit.html" class="nav-btn active">🎯 Habit Tracker</a>
    </div>

    <!-- 頂部：今日安排區塊 -->
    <div class="today-box">
      <div class="today-header">
        <div class="today-title">📌 今日安排 <span id="todayDateStr" style="font-size: 0.85rem; color: #64748b; font-weight: normal;"></span></div>
        <div id="todayBadge"></div>
      </div>
      <div id="todaySchedule" class="today-grid">
        <div style="color: #64748b; font-size: 0.85rem;">⏳ 載入今日行程中...</div>
      </div>
    </div>

    <!-- 🎯 中間新增：今日 Daily Log 區塊 (地位於今天安排以下、月曆之前) -->
    <div class="daily-box">
      <div class="daily-header">
        <div class="daily-title">📝 今日 Daily Log 工作與筆記</div>
        <a href="daily.html" style="font-size: 0.82rem; color: #4f46e5; font-weight: bold; text-decoration: none;">前往完整 Daily Log 頁面 ➔</a>
      </div>
      <div id="todayDailyList" class="daily-list">
        <div style="color: #64748b; font-size: 0.85rem;">⏳ 載入今日 Daily Log 中...</div>
      </div>
    </div>

    <!-- 月份控制項 -->
    <div class="calendar-controls">
      <button class="btn-month" onclick="changeMonth(-1)">◀ 上月</button>
      <select id="monthSelect" onchange="onMonthSelectChange()"></select>
      <button class="btn-month" onclick="changeMonth(1)">下月 ▶</button>
    </div>

    <!-- 圖例 -->
    <div class="legend-container">
      <div style="display:flex; align-items:center; gap:4px;"><span class="tag-badge badge-cycle">A-F</span> 循環日</div>
      <div style="display:flex; align-items:center; gap:4px;"><span class="tag-badge badge-holiday">假期</span> 學校假期</div>
      <div style="display:flex; align-items:center; gap:4px;"><span class="tag-badge badge-activity">活動</span> 特別活動</div>
    </div>

    <div id="loading">⏳ 正在載入校曆與時間表...</div>

    <!-- 電腦端：網格 View -->
    <div id="calendarGrid" class="calendar-grid"></div>

    <!-- 手機端：直向卡片 View -->
    <div id="calendarList" class="calendar-list"></div>
  </div>

  <script>
    const CSV_URL = 'Sch Calendar-Grid view.csv';
    const GOOGLE_SHEET_ID = '1ultOcsf8s4bFj7CrqyD_DlN4hOZ8ekK7ip4czQQl5Ms';
    const TIMETABLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=timetable&t=${new Date().getTime()}`;
    
    // Daily Log CSV URL (GID: 887624823)
    const DAILY_GID = '887624823';
    const DAILY_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${DAILY_GID}&t=${new Date().getTime()}`;
    const API_URL = 'https://script.google.com/macros/s/AKfycbz72-QL780wO-NVLsszPusQN3WGqCCeb-vn0yZEI8I6dgGwFaawpJtbUATozrE631rE/exec';

    let calendarData = {};
    let timetableRows = [];
    let dailyRows = [];
    let availableMonths = [];
    let currentYearMonth = '';
    const todayStr = new Date().toISOString().split('T')[0];

    window.addEventListener('DOMContentLoaded', () => {
      // 讀取校曆 CSV
      Papa.parse(CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (results) => {
          processCalendarData(results.data);
          // 讀取課堂時間表
          loadTimetable();
          // 讀取 Daily Log
          loadDailyLog();
        }
      });
    });

    function loadTimetable() {
      Papa.parse(TIMETABLE_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (res) => {
          if (res.data) timetableRows = res.data;
          document.getElementById('loading').style.display = 'none';
          renderTodaySchedule();
        }
      });
    }

    /* 讀取 Daily Log 資料並篩選今日工作 */
    function loadDailyLog() {
      Papa.parse(DAILY_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (res) => {
          if (res.data) {
            dailyRows = res.data.map((item, index) => ({
              ...item,
              _rowIndex: index + 2
            }));
            renderTodayDailyLog();
          }
        }
      });
    }

    /* 渲染今日 Daily Log 工作 */
    function renderTodayDailyLog() {
      const container = document.getElementById('todayDailyList');
      container.innerHTML = '';

      const todayLogs = dailyRows.filter(r => (r.Date || '').trim() === todayStr);

      if (todayLogs.length === 0) {
        container.innerHTML = `<div style="color:#64748b; font-size:0.85rem;">今天尚無 Daily Log 事項。可點擊右上角進入 Daily Log 快速記錄！</div>`;
        return;
      }

      todayLogs.forEach(item => {
        const isDone = (item.Status === '已完成');
        const div = document.createElement('div');
        div.className = `daily-item ${isDone ? 'done' : ''}`;
        
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:bold; color:#4f46e5;">${item.Type || '•'}</span>
            <span class="daily-text">${item.Content || ''}</span>
            ${item.Time ? `<span style="font-size:0.75rem; color:#94a3b8;">(${item.Time})</span>` : ''}
          </div>
          <button class="status-btn ${isDone ? 'done' : 'todo'}" onclick="toggleDailyStatus(${item._rowIndex}, '${item.Status}')">
            ${isDone ? '✅ 完成' : '⏳ 待辦'}
          </button>
        `;
        container.appendChild(div);
      });
    }

    /* 在 index 頁面直接切換 Daily Log 狀態 */
    function toggleDailyStatus(rowIndex, currentStatus) {
      const newStatus = (currentStatus === '已完成') ? '未完成' : '已完成';
      const target = dailyRows.find(r => r._rowIndex === rowIndex);
      if (target) {
        target.Status = newStatus;
        renderTodayDailyLog();
      }
      fetch(`${API_URL}?gid=${DAILY_GID}&action=toggleStatus&rowIndex=${rowIndex}&newStatus=${encodeURIComponent(newStatus)}`, { mode: 'no-cors' });
    }

    function processCalendarData(rows) {
      const monthSet = new Set();
      rows.forEach(row => {
        if (!row.Date) return;
        const parts = row.Date.split('/');
        if (parts.length === 3) {
          const formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          const ym = `${parts[2]}-${parts[1].padStart(2, '0')}`;

          calendarData[formattedDate] = {
            weekday: row['Weekday'] || '',
            cycleDay: row['Cycle Day'] || '',
            holiday: row['Sch Holiday/Special Sch Day'] || '',
            activity: row['Special Activity'] || ''
          };
          monthSet.add(ym);
        }
      });

      availableMonths = Array.from(monthSet).sort();
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      availableMonths.forEach(ym => {
        const [y, m] = ym.split('-');
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `${y} 年 ${parseInt(m, 10)} 月`;
        select.appendChild(opt);
      });

      const todayYM = todayStr.substring(0, 7);
      currentYearMonth = availableMonths.includes(todayYM) ? todayYM : (availableMonths[0] || '');
      select.value = currentYearMonth;

      renderCalendar(currentYearMonth);
    }

    /* 渲染今日安排 */
    function renderTodaySchedule() {
      const todayInfo = calendarData[todayStr];
      const todayBox = document.getElementById('todaySchedule');
      const todayDateStr = document.getElementById('todayDateStr');
      const todayBadge = document.getElementById('todayBadge');

      const d = new Date();
      const dateDisplay = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
      todayDateStr.textContent = `(${dateDisplay})`;

      if (!todayInfo) {
        todayBox.innerHTML = `<div style="color:#64748b; font-size:0.85rem;">今日無校曆紀錄或為放假日。</div>`;
        return;
      }

      let badgeHtml = '';
      if (todayInfo.cycleDay && todayInfo.cycleDay !== '-') badgeHtml += `<span class="tag-badge badge-cycle">${todayInfo.cycleDay}</span> `;
      if (todayInfo.holiday) badgeHtml += `<span class="tag-badge badge-holiday">${todayInfo.holiday}</span> `;
      if (todayInfo.activity) badgeHtml += `<span class="tag-badge badge-activity">${todayInfo.activity}</span>`;
      todayBadge.innerHTML = badgeHtml;

      // 比對當天時間表
      const cycle = String(todayInfo.cycleDay || '').trim();
      const matched = timetableRows.filter(r => {
        const rDay = String(r['Cycle'] || r['循環日'] || '').trim();
        return rDay && rDay.toLowerCase() === cycle.toLowerCase();
      });

      if (matched.length === 0) {
        todayBox.innerHTML = `<div style="color:#64748b; font-size:0.85rem;">今日沒有預定的課堂或當值安排。</div>`;
        return;
      }

      let cardsHtml = '';
      matched.forEach(item => {
        const period = item['Period'] || item['課節'] || '';
        const subject = item['Subject'] || item['科目'] || '';
        const className = item['Class'] || item['班別'] || '';
        const room = item['Room'] || item['地點'] || '';
        const duty = item['Break Duty'] || item['Playtime Duty'] || item['Lunch Duty'] || item['Dismissal Duty'] || '';

        if (duty) {
          cardsHtml += `<div class="today-card duty"><b>📢 當值：</b>${duty}</div>`;
        }
        if (subject) {
          cardsHtml += `<div class="today-card"><b>${period}：</b>${subject} (${className}) <span style="color:#64748b;">📍${room}</span></div>`;
        }
      });

      todayBox.innerHTML = cardsHtml;
    }

    /* 渲染月曆 (兼顧 Grid 與 List 模式) */
    function renderCalendar(ym) {
      const grid = document.getElementById('calendarGrid');
      const list = document.getElementById('calendarList');
      grid.innerHTML = '';
      list.innerHTML = '';

      if (!ym) return;

      const [year, month] = ym.split('-').map(Number);
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

      // 1. Grid 模式 Header
      weekDays.forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-header-day';
        header.textContent = day;
        grid.appendChild(header);
      });

      const startingDayOfWeek = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();

      // 前方補白
      for (let i = 0; i < startingDayOfWeek; i++) {
        grid.appendChild(createCell('day-cell other-month', ''));
      }

      // 2. 渲染每一天
      for (let day = 1; day <= daysInMonth; day++) {
        const monthStr = String(month).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const fullDateStr = `${year}-${monthStr}-${dayStr}`;
        const data = calendarData[fullDateStr];

        const isToday = (fullDateStr === todayStr);

        // --- Grid 網格儲存格 ---
        let gridContent = `<div class="day-number">${day}</div>`;
        if (data) {
          if (data.cycleDay && data.cycleDay !== '-') gridContent += `<div class="event-tag event-cycle">${data.cycleDay}</div>`;
          if (data.holiday) gridContent += `<div class="event-tag event-holiday">${data.holiday}</div>`;
          if (data.activity) gridContent += `<div class="event-tag event-activity">${data.activity}</div>`;
        }
        grid.appendChild(createCell(`day-cell ${isToday ? 'is-today' : ''}`, gridContent));

        // --- List 清單卡片 (手機端優化) ---
        if (data && (data.cycleDay || data.holiday || data.activity || isToday)) {
          const dayOfWeekText = weekDays[new Date(year, month - 1, day).getDay()];
          let listHtml = `
            <div class="list-day-header">
              <span>${month}月${day}日 (${dayOfWeekText}) ${isToday ? '📌 今日' : ''}</span>
              ${data.cycleDay && data.cycleDay !== '-' ? `<span class="tag-badge badge-cycle">${data.cycleDay}</span>` : ''}
            </div>
            <div class="list-day-events">
              ${data.holiday ? `<span class="event-tag event-holiday">🚩 ${data.holiday}</span>` : ''}
              ${data.activity ? `<span class="event-tag event-activity">⭐ ${data.activity}</span>` : ''}
            </div>
          `;
          const listCard = document.createElement('div');
          listCard.className = `list-day-card ${isToday ? 'is-today' : ''}`;
          listCard.innerHTML = listHtml;
          list.appendChild(listCard);
        }
      }

      // 後方補白
      const totalRendered = startingDayOfWeek + daysInMonth;
      const remainingCells = (7 - (totalRendered % 7)) % 7;
      for (let i = 0; i < remainingCells; i++) {
        grid.appendChild(createCell('day-cell other-month', ''));
      }
    }

    function createCell(className, content) {
      const cell = document.createElement('div');
      cell.className = className;
      cell.innerHTML = content;
      return cell;
    }

    function onMonthSelectChange() {
      currentYearMonth = document.getElementById('monthSelect').value;
      renderCalendar(currentYearMonth);
    }

    function changeMonth(delta) {
      const idx = availableMonths.indexOf(currentYearMonth);
      if (idx !== -1 && idx + delta >= 0 && idx + delta < availableMonths.length) {
        currentYearMonth = availableMonths[idx + delta];
        document.getElementById('monthSelect').value = currentYearMonth;
        renderCalendar(currentYearMonth);
      }
    }
