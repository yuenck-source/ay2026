<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026-2027 Teaching & Form Teacher Dashboard</title>

  <!-- PapaParse 用於高效率解析 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

 <style>
  :root {
    --primary-color: #2563eb;
    --timetable-color: #0284c7;
    --math-color: #0d9488;
    --sow-color: #7c3aed;
    --ft-color: #ea580c;
    --bg-color: #f8fafc;
    --border-color: #cbd5e1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: #1e293b;
    margin: 0;
    padding: 8px;
  }

  .container {
    max-width: 1150px;
    margin: 0 auto;
    background: #ffffff;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    box-sizing: border-box;
    overflow: hidden; /* 防止按鈕溢出畫面 */
  }

  /* 頂部標題 */
  .header {
    border-bottom: 2px solid var(--primary-color);
    padding-bottom: 8px;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    font-size: 1.15rem;
    color: #1e3a8a;
    text-align: center;
  }

  /* 📱 分頁標籤頁 (Tabs)：手機版改為可橫向滑動，避免佔據多行 */
  .nav-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .nav-tabs::-webkit-scrollbar { display: none; } /* 隱藏滾動條 */

  .tab-btn {
    padding: 6px 12px;
    font-size: 0.82rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background-color: #f1f5f9;
    color: #475569;
    cursor: pointer;
    font-weight: 600;
    flex: 0 0 auto; /* 防止被擠壓 */
    text-align: center;
  }

  .tab-btn.active { background-color: var(--primary-color); color: #ffffff; border-color: var(--primary-color); }
  .tab-btn.active.tt-tab { background-color: var(--timetable-color); border-color: var(--timetable-color); }
  .tab-btn.active.math-tab { background-color: var(--math-color); border-color: var(--math-color); }
  .tab-btn.active.sow-tab { background-color: var(--sow-color); border-color: var(--sow-color); }
  .tab-btn.active.ft-tab { background-color: var(--ft-color); border-color: var(--ft-color); }

  /* 控制項與按鈕通用 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 10px;
  }

  select, button {
    padding: 6px 8px;
    font-size: 0.85rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background-color: #fff;
    cursor: pointer;
  }

  .btn-nav {
    padding: 5px 10px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  .btn-primary { background-color: var(--primary-color); color: white; border: none; }
  .btn-secondary { background-color: #0284c7; color: white; border: none; }

  /* 📱 週檢視區塊 (RWD 響應式佈局) */
  .week-section {
    background-color: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }

  .week-section-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  @media (min-width: 640px) {
    .week-section-header {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
  }

  .week-section-title {
    font-size: 0.9rem;
    font-weight: bold;
    color: #0369a1;
    margin: 0;
    white-space: nowrap;
  }

  /* 週切換控制列：確保按鈕與下拉選單排在同一行 */
  .week-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    width: 100%;
  }

  #weekSelect {
    flex: 1;
    min-width: 0; /* 防止 overflow */
    text-align: center;
    font-size: 0.82rem;
    padding: 5px;
  }

  .week-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 8px;
  }

  .week-card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .week-card.is-weekend { background-color: #fafafa; border-color: #e2e8f0; }

  .week-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed #e2e8f0;
    padding-bottom: 4px;
  }

  .week-card-date { font-weight: bold; font-size: 0.85rem; color: #334155; }
  .week-card-weekday { font-size: 0.75rem; color: #64748b; }
  .week-card-weekday.weekend-text { color: #e11d48; font-weight: bold; }

  /* 週檢視內課堂時間表樣式 */
  .week-tt-box {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px dashed #cbd5e1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .week-tt-title { font-size: 0.72rem; font-weight: bold; color: #0369a1; margin-bottom: 2px; }

  .week-tt-item {
    background-color: #f0f9ff;
    border-left: 3px solid var(--timetable-color);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 0.78rem;
    line-height: 1.3;
  }

  .week-tt-period { font-weight: bold; color: #0284c7; }
  .week-tt-class { font-weight: bold; color: #ea580c; }
  .week-tt-subject { font-weight: bold; color: #0f172a; display: block; margin-top: 1px; }
  .week-tt-room { color: #64748b; font-size: 0.7rem; }

  /* 隱藏手機版按鈕的多餘文字，只留箭頭 */
  @media (max-width: 480px) {
    .btn-text { display: none; }
    .btn-nav { padding: 5px 8px; }
  }

  /* 月曆與其他樣式 */
  .legend { display: flex; gap: 6px; font-size: 0.75rem; margin-bottom: 8px; flex-wrap: wrap; }
  .badge-cycle { background: #2563eb; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.72rem; }
  .badge-holiday { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; border: 1px solid #fca5a5; font-size: 0.72rem; }
  .badge-activity { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; border: 1px solid #fcd34d; font-size: 0.72rem; }

  .scroll-hint { display: none; font-size: 0.75rem; color: #64748b; margin-bottom: 6px; text-align: right; }
  @media (max-width: 768px) { .scroll-hint { display: block; } }

  .calendar-scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border-color); border-radius: 6px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); gap: 1px; min-width: 630px; background-color: var(--border-color); }
  .weekday-header { background-color: #1e293b; color: #ffffff; text-align: center; padding: 6px 0; font-weight: bold; font-size: 0.8rem; }
  .day-cell { background-color: #ffffff; min-height: 80px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
  .day-num { font-weight: bold; font-size: 0.85rem; }
  .holiday-tag { background-color: #fee2e2; color: #991b1b; font-size: 0.7rem; padding: 2px 4px; border-radius: 3px; border-left: 2px solid #ef4444; }
  .activity-tag { background-color: #fef3c7; color: #78350f; font-size: 0.7rem; padding: 2px 4px; border-radius: 3px; border-left: 2px solid #f59e0b; }

  /* 表格與卡片 */
  .data-table-wrapper { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
  th { background-color: #f1f5f9; color: #334155; }
</style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>校曆與班務教學綜合面板</h1>
    </div>

    <!-- 切換 Tab 選單 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('sch-grid')">📊 校曆與 週檢視</button>
      <button class="tab-btn tt-tab" onclick="switchTab('timetable-log')">📅 課堂時間表</button>
      <button class="tab-btn math-tab" onclick="switchTab('math-log')">📐 數學日誌</button>
      <button class="tab-btn sow-tab" onclick="switchTab('sow-log')">📘 教學計劃 SOW</button>
      <button class="tab-btn ft-tab" onclick="switchTab('ft-log')">🏫 班主任事務</button>
      <button class="tab-btn" onclick="switchTab('gcal')">📅 Google Cal</button>
    </div>

    <!-- TAB 1: CSV 校曆網格區塊 -->
    <div id="tab-sch-grid">
      <div id="weekSection" class="week-section" style="display: none;">
  <div class="week-section-header">
    <div class="week-section-title">🗓️ 週安排檢視</div>
    <div class="week-controls">
      <button class="btn-nav btn-secondary" onclick="changeWeek(-1)">◀<span class="btn-text"> 上一週</span></button>
      <select id="weekSelect" onchange="onWeekSelectChange()"></select>
      <button class="btn-nav btn-secondary" onclick="changeWeek(1)"><span class="btn-text">下一週 </span>▶</button>
    </div>
  </div>
  <div id="weekCards" class="week-cards-grid"></div>
</div>

      <div class="controls">
        <button class="btn-nav btn-primary" onclick="changeMonth(-1)">◀<span class="btn-text"> 上一個月</span></button>
        <select id="monthSelect" onchange="renderCalendar()"></select>
        <button class="btn-nav btn-primary" onclick="changeMonth(1)"><span class="btn-text">下一個月 </span>▶</button>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="badge-cycle">A-F</span> 循環日</div>
        <div class="legend-item"><span class="badge-holiday">假期</span> 學校假期</div>
        <div class="legend-item"><span class="badge-activity">活動</span> 特別活動</div>
      </div>

      <div class="scroll-hint">💡 手指左右滑動可檢視完整月曆 ➔</div>
      <div id="loading">載入 CSV 資料中，請稍候...</div>
      
      <div class="calendar-scroll-wrapper">
        <div id="calendar" class="calendar-grid" style="display: none;"></div>
      </div>
    </div>

    <!-- TAB 2: 課堂時間表 Timetable -->
    <div id="tab-timetable-log" style="display: none;">
      <div class="section-header-box tt-header-box">
        <div style="font-weight: bold; color: #0369a1;">📅 課堂時間表 (Timetable)</div>
        <div>
          <select id="ttCycleSelect" onchange="renderTimetable()">
            <option value="ALL">所有循環日 (All Cycle Days)</option>
          </select>
        </div>
      </div>
      <div id="ttLoading" style="text-align: center; padding: 20px; color: #64748b;">載入時間表資料中...</div>
      <div id="ttContent" class="data-table-wrapper">
        <table id="ttTable">
          <thead>
            <tr>
              <th>循環日 / 星期</th>
              <th>課節</th>
              <th>上課時間</th>
              <th>班別</th>
              <th>科目</th>
              <th>地點/課室</th>
              <th>備註</th>
            </tr>
          </thead>
          <tbody id="ttBody"></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 3: 數學科教學日誌 -->
    <div id="tab-math-log" style="display: none;">
      <div class="section-header-box math-header-box">
        <div style="font-weight: bold; color: #115e59;">📐 數學科教學進度與提示</div>
        <div>
          <select id="mathClassSelect" onchange="renderMathLogs()">
            <option value="ALL">所有班別 (All)</option>
          </select>
        </div>
      </div>
      <div id="mathLoading" style="text-align: center; padding: 20px; color: #64748b;">載入中...</div>
      <div id="mathGrid" class="card-grid"></div>
    </div>

    <!-- TAB 4: 教學計劃 SOW -->
    <div id="tab-sow-log" style="display: none;">
      <div class="section-header-box sow-header-box">
        <div style="font-weight: bold; color: #5b21b6;">📘 科組教學計劃 (Scheme of Work)</div>
        <div id="sowProgressText" style="font-size: 0.88rem; font-weight: bold; color: #6b21a8;">完成度: 0%</div>
      </div>
      <div style="margin-bottom: 15px;">
        <div class="progress-bar-container">
          <div id="sowProgressBar" class="progress-bar-fill"></div>
        </div>
      </div>
      <div id="sowLoading" style="text-align: center; padding: 20px; color: #64748b;">載入 SOW 資料中...</div>
      <div id="sowGrid" class="card-grid"></div>
    </div>

    <!-- TAB 5: 班主任事務 -->
    <div id="tab-ft-log" style="display: none;">
      <div class="section-header-box ft-header-box">
        <div style="font-weight: bold; color: #9a3412;">🏫 班主任事務與學生跟進</div>
        <div style="display:flex; gap:8px;">
          <select id="ftClassSelect" onchange="renderFTLogs()">
            <option value="ALL">所有班別</option>
          </select>
          <select id="ftStatusSelect" onchange="renderFTLogs()">
            <option value="ALL">所有狀態</option>
            <option value="未完成">未完成/跟進中</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
      </div>
      <div id="ftLoading" style="text-align: center; padding: 20px; color: #64748b;">載入班主任資料中...</div>
      <div id="ftGrid" class="card-grid"></div>
    </div>

    <!-- TAB 6: Google Calendar -->
    <div id="tab-gcal" style="display: none;">
      <div class="gcal-container">
        <iframe src="https://calendar.google.com/calendar/embed?src=yuenck%40web.wfjlps.edu.hk&ctz=Asia%2FHong_Kong" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
      </div>
    </div>

  </div>

  <script>
    const CSV_URL = 'Sch Calendar-Grid view.csv';
    const GOOGLE_SHEET_ID = '1ultOcsf8s4bFj7CrqyD_DlN4hOZ8ekK7ip4czQQl5Ms';
    
    const TIMETABLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=timetable`;
    const MATH_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/export?format=csv`;
    const SOW_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=SOW`;
    const FT_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/export?format=csv&sheet=FormTeacher`;

    let calendarData = {}; 
    let availableDatesSorted = [];
    let availableMonths = [];
    let allWeeks = [];
    let currentWeekIndex = 0;
    let currentMonthIndex = 0;

    let timetableRows = [], mathRows = [], sowRows = [], ftRows = [];

    window.addEventListener('DOMContentLoaded', () => {
      // 1. 校曆 CSV
      Papa.parse(CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (results) => {
          processData(results.data);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('weekSection').style.display = 'block';
          document.getElementById('calendar').style.display = 'grid';
        }
      });

      // 2. Google Sheet 各分頁
      loadGoogleSheets();
    });

    function switchTab(tabName) {
      const tabs = ['sch-grid', 'timetable-log', 'math-log', 'sow-log', 'ft-log', 'gcal'];
      tabs.forEach(t => document.getElementById(`tab-${t}`).style.display = 'none');

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      if (tabName === 'sch-grid') { document.getElementById('tab-sch-grid').style.display = 'block'; buttons[0].classList.add('active'); }
      else if (tabName === 'timetable-log') { document.getElementById('tab-timetable-log').style.display = 'block'; buttons[1].classList.add('active'); }
      else if (tabName === 'math-log') { document.getElementById('tab-math-log').style.display = 'block'; buttons[2].classList.add('active'); }
      else if (tabName === 'sow-log') { document.getElementById('tab-sow-log').style.display = 'block'; buttons[3].classList.add('active'); }
      else if (tabName === 'ft-log') { document.getElementById('tab-ft-log').style.display = 'block'; buttons[4].classList.add('active'); }
      else if (tabName === 'gcal') { document.getElementById('tab-gcal').style.display = 'block'; buttons[5].classList.add('active'); }
    }

    /* 讀取 Google Sheet 所有資料 */
    function loadGoogleSheets() {
      // 時間表
      Papa.parse(TIMETABLE_CSV_URL, { download: true, header: true, skipEmptyLines: true, complete: res => {
        timetableRows = res.data; document.getElementById('ttLoading').style.display = 'none';
        setupTimetableCycleFilter(); renderTimetable();
        if (allWeeks.length > 0) renderWeekCards(currentWeekIndex);
      }});

      // 數學日誌
      Papa.parse(MATH_CSV_URL, { download: true, header: true, skipEmptyLines: true, complete: res => {
        mathRows = res.data; document.getElementById('mathLoading').style.display = 'none';
        setupMathClassFilter(); renderMathLogs();
      }});

      // SOW
      Papa.parse(SOW_CSV_URL, { download: true, header: true, skipEmptyLines: true, complete: res => {
        sowRows = res.data; document.getElementById('sowLoading').style.display = 'none';
        renderSOWLogs();
      }});

      // 班主任事務 FormTeacher
      const ftFetchUrl = `${FT_CSV_URL}&_t=${new Date().getTime()}`;
      Papa.parse(ftFetchUrl, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: res => {
          if (!res.data || res.data.length <= 1) {
            document.getElementById('ftLoading').innerHTML = 'FormTeacher 分頁暫無數據。';
            return;
          }
          ftRows = res.data.slice(1);
          document.getElementById('ftLoading').style.display = 'none';
          setupFTClassFilter();
          renderFTLogs();
        },
        error: (err) => {
          document.getElementById('ftLoading').innerHTML = '無法載入 FormTeacher 資料，請檢查分頁名稱與共用權限。';
        }
      });
    }

    /* 課堂時間表處理 */
    function setupTimetableCycleFilter() {
      const cycleSet = new Set();
      timetableRows.forEach(row => {
        const c = row.Cycle || row['循環日'] || row['Day'] || row['Weekday'] || row['星期'];
        if (c) cycleSet.add(c.trim());
      });
      const select = document.getElementById('ttCycleSelect');
      select.innerHTML = '<option value="ALL">所有循環日/星期 (All)</option>';
      Array.from(cycleSet).sort().forEach(cyc => {
        const opt = document.createElement('option'); opt.value = cyc; opt.textContent = `循環日/星期: ${cyc}`; select.appendChild(opt);
      });
    }

    function renderTimetable() {
  const tbody = document.getElementById('ttBody'); tbody.innerHTML = '';
  const selectedCycle = document.getElementById('ttCycleSelect').value;

  const filtered = timetableRows.filter(r => {
    const c = (r.Cycle || r['循環日'] || r['Day'] || r['Weekday'] || r['星期'] || '').trim();
    return selectedCycle === 'ALL' || c === selectedCycle;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">暫無時間表資料</td></tr>';
    return;
  }

  filtered.forEach(row => {
    const cycle = row.Cycle || row['循環日'] || row['Day'] || row['Weekday'] || row['星期'] || '-';
    const period = row.Period || row['課節'] || '-';
    
    // 組合顯示 Mon-Thu 與 Fri 時間
    const timeMonThu = row.Time_MonThu || '';
    const timeFri = row.Time_Fri || '';
    let timeDisplay = '-';
    
    if (timeMonThu && timeFri) {
      timeDisplay = `Mon-Thu: ${timeMonThu}<br><span style="color:#e11d48;">Fri: ${timeFri}</span>`;
    } else {
      timeDisplay = timeMonThu || timeFri || row.Time || '-';
    }

    const className = row.Class || row['班別'] || '-';
    const subject = row.Subject || row['科目'] || '-';
    const room = row.Room || row['地點'] || row['課室'] || '-';
    const remarks = row.Remarks || row['備註'] || '-';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="badge-cycle">${cycle}</span></td>
      <td><strong>${period}</strong></td>
      <td style="color:#0284c7; font-weight:600; font-size:0.85rem;">${timeDisplay}</td>
      <td><span style="color:#ea580c; font-weight:bold;">${className}</span></td>
      <td>${subject}</td>
      <td>📍 ${room}</td>
      <td style="color:#64748b;">${remarks}</td>
    `;
    tbody.appendChild(tr);
  });
}

    /* 依據 Cycle Day / 星期 取得對應課堂資料的輔助函數 */
    function getTimetableForCycle(cycleStr) {
      if (!cycleStr || !timetableRows || timetableRows.length === 0) return [];
      const target = String(cycleStr).trim().toUpperCase();
      return timetableRows.filter(row => {
        const c = String(row.Cycle || row['循環日'] || row['Day'] || row['Weekday'] || row['星期'] || '').trim().toUpperCase();
        return c === target || c === `DAY ${target}` || `DAY ${c}` === target;
      });
    }

    /* 數學日誌處理 */
    function setupMathClassFilter() {
      const classSet = new Set();
      mathRows.forEach(row => { const c = row.Class || row['班別']; if (c) classSet.add(c.trim()); });
      const select = document.getElementById('mathClassSelect');
      select.innerHTML = '<option value="ALL">所有班別 (All)</option>';
      Array.from(classSet).sort().forEach(cls => {
        const opt = document.createElement('option'); opt.value = cls; opt.textContent = `班別: ${cls}`; select.appendChild(opt);
      });
    }

    function renderMathLogs() {
      const container = document.getElementById('mathGrid'); container.innerHTML = '';
      const selectedClass = document.getElementById('mathClassSelect').value;
      const filtered = mathRows.filter(r => selectedClass === 'ALL' || (r.Class || r['班別'] || '').trim() === selectedClass);

      if (filtered.length === 0) { container.innerHTML = '<div style="grid-column:1/-1; color:#64748b; text-align:center;">暫無資料</div>'; return; }
      [...filtered].reverse().forEach(row => {
        const card = document.createElement('div'); card.className = 'data-card math-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>📅 ${row.Date || row['日期'] || ''}</strong>
            <span style="background:#0d9488; color:#fff; padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:bold;">${row.Class || row['班別'] || ''}</span>
          </div>
          <div><strong>📘 課題：</strong> ${row.Topic || row['章節/課題'] || ''}</div>
          <div><strong>✏️ 進度：</strong> ${row.Progress || row['課堂進度'] || ''}</div>
          <div><strong>📦 功課：</strong> ${row.Homework || row['功課收發'] || ''}</div>
          ${row.Notice || row['特別提示'] ? `<div style="background:#fff7ed; border-left:3px solid #f97316; padding:6px; font-size:0.82rem; color:#9a3412;">🔔 ${row.Notice || row['特別提示']}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    /* SOW 處理 */
    function renderSOWLogs() {
      const container = document.getElementById('sowGrid'); container.innerHTML = '';
      if (sowRows.length === 0) { container.innerHTML = '<div style="grid-column:1/-1; color:#64748b; text-align:center;">暫無 SOW 資料。</div>'; return; }

      let completedCount = 0;
      sowRows.forEach(row => {
        const status = row.Status || row['完成狀態'] || '未完成';
        if (status === '已完成') completedCount++;

        let badgeClass = 'badge-status-todo';
        if (status === '已完成') badgeClass = 'badge-status-done';
        else if (status === '進行中') badgeClass = 'badge-status-doing';

        const card = document.createElement('div'); card.className = 'data-card sow-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${row.Chapter || row['章節/單元'] || ''}</strong>
            <span class="${badgeClass}">${status}</span>
          </div>
          <div style="font-size:1.05rem; font-weight:bold; color:#4c1d95;">${row.Topic || row['課題名稱'] || ''}</div>
          <div style="font-size:0.85rem; color:#64748b;">預計完成：${row['Target Date'] || row['預計完成日期'] || '未設定'}</div>
          ${row['Completion Date'] || row['實際完成日期'] ? `<div style="font-size:0.85rem; color:#166534;">實際完成：${row['Completion Date'] || row['實際完成日期']}</div>` : ''}
          ${row.Reflection || row['單元檢討/備註'] ? `<div style="background:#f3e8ff; border-left:3px solid #7c3aed; padding:6px; font-size:0.82rem; color:#5b21b6; margin-top:4px;">💭 <strong>檢討：</strong> ${row.Reflection || row['單元檢討/備註']}</div>` : ''}
        `;
        container.appendChild(card);
      });

      const percent = Math.round((completedCount / sowRows.length) * 100) || 0;
      document.getElementById('sowProgressText').textContent = `進度: ${completedCount}/${sowRows.length} (${percent}%)`;
      document.getElementById('sowProgressBar').style.width = `${percent}%`;
    }

    /* 班主任事務 (FormTeacher) 處理 */
    function setupFTClassFilter() {
      const classSet = new Set();
      ftRows.forEach(row => {
        const cls = row[1] ? String(row[1]).trim() : '';
        if (cls) classSet.add(cls);
      });
      const select = document.getElementById('ftClassSelect');
      select.innerHTML = '<option value="ALL">所有班別</option>';
      Array.from(classSet).sort().forEach(cls => {
        const opt = document.createElement('option'); opt.value = cls; opt.textContent = `班別: ${cls}`; select.appendChild(opt);
      });
    }

    function renderFTLogs() {
      const container = document.getElementById('ftGrid'); container.innerHTML = '';
      const filterClass = document.getElementById('ftClassSelect').value;
      const filterStatus = document.getElementById('ftStatusSelect').value;

      const filtered = ftRows.filter(r => {
        const cls = r[1] ? String(r[1]).trim() : '';
        const status = r[5] ? String(r[5]).trim() : '未完成';

        const matchClass = (filterClass === 'ALL' || cls === filterClass);
        let matchStatus = true;
        if (filterStatus === '未完成') matchStatus = (status !== '已完成');
        else if (filterStatus === '已完成') matchStatus = (status === '已完成');

        return matchClass && matchStatus;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1; color:#64748b; text-align:center;">目前沒有跟進事項。</div>';
        return;
      }

      [...filtered].reverse().forEach(row => {
        const date = row[0] ? String(row[0]).trim() : '';
        const className = row[1] ? String(row[1]).trim() : '';
        const category = row[2] ? String(row[2]).trim() : '';
        const task = row[3] ? String(row[3]).trim() : '';
        const targetStudent = row[4] ? String(row[4]).trim() : '';
        const status = row[5] ? String(row[5]).trim() : '未完成';
        const remarks = row[6] ? String(row[6]).trim() : '';

        let badgeClass = status === '已完成' ? 'badge-status-done' : 'badge-status-todo';

        const card = document.createElement('div'); card.className = 'data-card ft-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.85rem; color:#64748b;">📅 ${date}</span>
            <div style="display:flex; gap:4px; align-items:center;">
              ${className ? `<span style="background:#ea580c; color:#fff; padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:bold;">${className}</span>` : ''}
              <span class="${badgeClass}">${status}</span>
            </div>
          </div>
          ${category ? `<div style="margin-top:4px;"><span class="badge-category">${category}</span></div>` : ''}
          <div style="font-weight:bold; color:#9a3412; font-size:1rem; margin-top:6px;">📌 ${task}</div>
          ${targetStudent ? `<div style="font-size:0.88rem; color:#c2410c; margin-top:4px;">👤 <strong>目標學生：</strong> ${targetStudent}</div>` : ''}
          ${remarks ? `<div style="font-size:0.85rem; color:#475569; background:#fff7ed; padding:6px; border-radius:4px; border-left:3px solid #f97316; margin-top:6px;">💬 <strong>備註：</strong> ${remarks}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    /* 校曆與按 Week 分組邏輯 */
    function processData(rows) {
      const monthSet = new Set(); const dateList = [];
      rows.forEach(row => {
        if (!row.Date) return;
        const parts = row.Date.split('/');
        if (parts.length === 3) {
          const formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          calendarData[formattedDate] = row;
          monthSet.add(`${parts[2]}-${parts[1].padStart(2, '0')}`);
          dateList.push({ dateStr: formattedDate, rawRow: row, dt: new Date(formattedDate) });
        }
      });
      dateList.sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      availableDatesSorted = dateList;
      availableMonths = Array.from(monthSet).sort();

      const select = document.getElementById('monthSelect'); select.innerHTML = '';
      availableMonths.forEach((ym, idx) => {
        const opt = document.createElement('option'); opt.value = idx;
        const [y, m] = ym.split('-'); opt.textContent = `${y}年${parseInt(m)}月`;
        select.appendChild(opt);
      });

      parseAllWeeks(); 
      renderCalendar();
    }

    function parseAllWeeks() {
      allWeeks = [];
      if (availableDatesSorted.length === 0) return;

      let currentWeekDays = [];
      let weekCounter = 1;

      availableDatesSorted.forEach((item, idx) => {
        currentWeekDays.push(item);
        const dayOfWeek = item.dt.getDay();

        if (dayOfWeek === 0 || idx === availableDatesSorted.length - 1) {
          const startDate = currentWeekDays[0].dateStr;
          const endDate = currentWeekDays[currentWeekDays.length - 1].dateStr;
          
          const startM = parseInt(startDate.split('-')[1]);
          const startD = parseInt(startDate.split('-')[2]);
          const endM = parseInt(endDate.split('-')[1]);
          const endD = parseInt(endDate.split('-')[2]);

          allWeeks.push({
            label: `第 ${weekCounter} 週 (${startM}/${startD} - ${endM}/${endD})`,
            startDate: startDate,
            days: currentWeekDays
          });
          weekCounter++;
          currentWeekDays = [];
        }
      });

      const select = document.getElementById('weekSelect'); select.innerHTML = '';
      allWeeks.forEach((w, idx) => {
        const opt = document.createElement('option'); opt.value = idx; opt.textContent = w.label;
        select.appendChild(opt);
      });

      if (allWeeks.length > 0) renderWeekCards(0);
    }

    /* 渲染週安排檢視卡片 (課節旁附帶小字體上課時間) */
    function renderWeekCards(idx) {
      const container = document.getElementById('weekCards'); container.innerHTML = '';
      if (!allWeeks[idx]) return;
      document.getElementById('weekSelect').value = idx;

      allWeeks[idx].days.forEach(item => {
        const row = item.rawRow;
        const [y, m, d] = item.dateStr.split('-');
        const dayOfWeek = item.dt.getDay();
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const cycleDay = (row['Cycle Day'] || '').trim();

        // 取得當天 Cycle Day 對應之課堂時間表
        const matchedTT = getTimetableForCycle(cycleDay);

        let ttHtml = '';
        if (matchedTT.length > 0) {
          ttHtml = `<div class="week-tt-box">
            <div class="week-tt-title">📖 課堂時間表 (${cycleDay})</div>`;
          matchedTT.forEach(tt => {
            const period = tt.Period || tt['課節'] || '';
            const time = tt.Time || tt['時間'] || tt['上課時間'] || '';
            const className = tt.Class || tt['班別'] || '';
            const subject = tt.Subject || tt['科目'] || '';
            const room = tt.Room || tt['地點'] || tt['課室'] || '';

            ttHtml += `
              <div class="week-tt-item">
                <div>
                  <span class="week-tt-period">${period}</span>
                  ${time ? `<span class="week-tt-time">(${time})</span>` : ''}
                  <span class="week-tt-class">${className}</span>
                </div>
                <div>
                  <span class="week-tt-subject">${subject}</span>
                  ${room ? `<span class="week-tt-room">📍 ${room}</span>` : ''}
                </div>
              </div>
            `;
          });
          ttHtml += `</div>`;
        }

        const card = document.createElement('div');
        card.className = `week-card ${isWeekend ? 'is-weekend' : ''}`;
        card.innerHTML = `
          <div class="week-card-header">
            <div>
              <span class="week-card-date">${parseInt(m)}月${parseInt(d)}日</span>
              <span class="week-card-weekday ${isWeekend ? 'weekend-text' : ''}">(${row.Weekday || ''})</span>
            </div>
            ${cycleDay ? `<span class="badge-cycle">${cycleDay}</span>` : ''}
          </div>
          ${row['Sch Holiday/Special Sch Day'] ? `<div class="holiday-tag">${row['Sch Holiday/Special Sch Day']}</div>` : ''}
          ${row['Special Activity'] ? `<div class="activity-tag">${row['Special Activity']}</div>` : ''}
          ${ttHtml}
        `;
        container.appendChild(card);
      });
    }

    function onWeekSelectChange() {
      currentWeekIndex = parseInt(document.getElementById('weekSelect').value) || 0;
      renderWeekCards(currentWeekIndex);
      syncCalendarToWeek(currentWeekIndex);
    }

    function changeWeek(d) {
      let n = currentWeekIndex + d;
      if (n >= 0 && n < allWeeks.length) {
        currentWeekIndex = n;
        renderWeekCards(n);
        syncCalendarToWeek(n);
      }
    }

    function syncCalendarToWeek(idx) {
      if (!allWeeks[idx]) return;
      const ym = allWeeks[idx].startDate.substring(0,7);
      const mIdx = availableMonths.indexOf(ym);
      if (mIdx !== -1 && mIdx !== currentMonthIndex) {
        document.getElementById('monthSelect').value = mIdx;
        renderCalendar();
      }
    }

    function renderCalendar() {
      currentMonthIndex = parseInt(document.getElementById('monthSelect').value) || 0;
      const targetYM = availableMonths[currentMonthIndex]; if (!targetYM) return;
      const [year, month] = targetYM.split('-').map(Number);
      const calendarEl = document.getElementById('calendar'); calendarEl.innerHTML = '';

      ['日 Sun', '一 Mon', '二 Tue', '三 Wed', '四 Thu', '五 Fri', '六 Sat'].forEach((d, i) => {
        const h = document.createElement('div'); h.className = `weekday-header ${i===0||i===6?'weekend':''}`; h.textContent = d; calendarEl.appendChild(h);
      });

      const firstDay = new Date(year, month - 1, 1).getDay();
      const totalDays = new Date(year, month, 0).getDate();

      for (let i = 0; i < firstDay; i++) { const c = document.createElement('div'); c.className = 'day-cell other-month'; calendarEl.appendChild(c); }

      for (let d = 1; d <= totalDays; d++) {
        const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const row = calendarData[dateKey] || {};
        const cell = document.createElement('div'); cell.className = `day-cell ${row['Sch Holiday/Special Sch Day'] ? 'holiday-bg' : ''}`;
        cell.innerHTML = `
          <div class="day-header"><span class="day-num">${d}</span>${row['Cycle Day'] ? `<span class="badge-cycle">${row['Cycle Day']}</span>` : ''}</div>
          ${row['Sch Holiday/Special Sch Day'] ? `<div class="holiday-tag">${row['Sch Holiday/Special Sch Day']}</div>` : ''}
          ${row['Special Activity'] ? `<div class="activity-tag">${row['Special Activity']}</div>` : ''}
        `;
        calendarEl.appendChild(cell);
      }
    }

    function changeMonth(d) { let n = currentMonthIndex + d; if (n>=0 && n<availableMonths.length) { document.getElementById('monthSelect').value=n; renderCalendar(); } }

/* 依據 Cycle Day 或 星期 取得對應課堂資料的輔助函數 (增強版) */
    function getTimetableForDay(cycleStr, weekdayStr) {
      if (!timetableRows || timetableRows.length === 0) return [];
      
      const cleanCycle = cycleStr ? String(cycleStr).trim().toUpperCase() : '';
      const cleanWeekday = weekdayStr ? String(weekdayStr).trim().toUpperCase() : '';

      return timetableRows.filter(row => {
        const c = String(row.Cycle || row['循環日'] || row['Day'] || row['Weekday'] || row['星期'] || '').trim().toUpperCase();
        
        if (!c) return false;

        // 1. 比對循環日 (例如: "A", "Day A", "DAYA")
        if (cleanCycle) {
          if (c === cleanCycle || c === `DAY ${cleanCycle}` || `DAY ${c}` === cleanCycle || c.replace(/\s+/g, '') === cleanCycle.replace(/\s+/g, '')) {
            return true;
          }
        }

        // 2. 備用比對：按星期幾比對 (例如: "Mon", "Monday", "星期一")
        if (cleanWeekday) {
          if (c === cleanWeekday || cleanWeekday.includes(c) || c.includes(cleanWeekday)) {
            return true;
          }
        }

        return false;
      });
    }

   /* 渲染週安排檢視卡片 (自動判斷 Mon-Thu 或 Fri 時間) */
function renderWeekCards(idx) {
  const container = document.getElementById('weekCards'); container.innerHTML = '';
  if (!allWeeks[idx]) return;
  document.getElementById('weekSelect').value = idx;

  allWeeks[idx].days.forEach(item => {
    const row = item.rawRow;
    const [y, m, d] = item.dateStr.split('-');
    const dayOfWeek = item.dt.getDay(); // 0 是週日, 5 是週五, 6 是週六
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
    const cycleDay = (row['Cycle Day'] || '').trim();
    const weekday = (row['Weekday'] || '').trim();

    // 取得當天對應之課堂時間表
    const matchedTT = getTimetableForDay(cycleDay, weekday);

    let ttHtml = '';
    if (matchedTT.length > 0) {
      ttHtml = `<div class="week-tt-box">
        <div class="week-tt-title">📖 課堂時間表 ${cycleDay ? `(${cycleDay})` : ''}</div>`;
      
      matchedTT.forEach(tt => {
        const period = tt.Period || tt['課節'] || '';
        
        // 💡 關鍵判斷：週五 (dayOfWeek === 5) 取 Time_Fri，其餘取 Time_MonThu
        let time = '';
        if (dayOfWeek === 5) {
          time = tt.Time_Fri || tt.Time_MonThu || tt.Time || '';
        } else {
          time = tt.Time_MonThu || tt.Time_Fri || tt.Time || '';
        }

        const className = tt.Class || tt['班別'] || '';
        const subject = tt.Subject || tt['科目'] || '';
        const room = tt.Room || tt['地點'] || tt['課室'] || '';

        ttHtml += `
          <div class="week-tt-item">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
              <div>
                <span class="week-tt-period">${period}</span>
                ${time ? `<span style="font-size: 0.72rem; color: #0284c7; background: #e0f2fe; padding: 1px 4px; border-radius: 3px; font-weight: 500; margin-left: 2px;">${time}</span>` : ''}
              </div>
              <span class="week-tt-class">${className}</span>
            </div>
            <div style="margin-top: 2px;">
              <span class="week-tt-subject">${subject}</span>
              ${room ? `<span class="week-tt-room">📍 ${room}</span>` : ''}
            </div>
          </div>
        `;
      });
      ttHtml += `</div>`;
    }

    const card = document.createElement('div');
    card.className = `week-card ${isWeekend ? 'is-weekend' : ''}`;
    card.innerHTML = `
      <div class="week-card-header">
        <div>
          <span class="week-card-date">${parseInt(m)}月${parseInt(d)}日</span>
          <span class="week-card-weekday ${isWeekend ? 'weekend-text' : ''}">(${weekday || ''})</span>
        </div>
        ${cycleDay ? `<span class="badge-cycle">${cycleDay}</span>` : ''}
      </div>
      ${row['Sch Holiday/Special Sch Day'] ? `<div class="holiday-tag">${row['Sch Holiday/Special Sch Day']}</div>` : ''}
      ${row['Special Activity'] ? `<div class="activity-tag">${row['Special Activity']}</div>` : ''}
      ${ttHtml}
    `;
    container.appendChild(card);
  });
}
  </script>
