<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校曆與課堂時間表系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { margin-bottom: 25px; border-bottom: 3px solid var(--secondary-color); padding-bottom: 10px; }
        h1 { color: var(--primary-color); font-size: 1.8rem; }
        .subtitle { color: #666; font-size: 0.95rem; margin-top: 5px; }

        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .control-card { background: var(--card-bg); padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .control-card label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary-color); }
        .control-card input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem; }

        .today-card { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .today-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 12px; margin-bottom: 15px; }
        .today-date { font-size: 1.3rem; font-weight: bold; }
        .cycle-badge { background-color: var(--secondary-color); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 15px; }
        .lesson-item { background: rgba(255, 255, 255, 0.15); border-left: 4px solid var(--secondary-color); padding: 10px 14px; border-radius: 4px; backdrop-filter: blur(5px); }
        .lesson-time { font-size: 0.8rem; color: #bdc3c7; margin-bottom: 4px; }
        .lesson-main { font-size: 1.05rem; font-weight: bold; }
        .lesson-room { font-size: 0.85rem; color: #ecf0f1; margin-top: 3px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background-color: #e0e0e0; color: #333; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background-color: var(--secondary-color); color: white; }
        .tab-content { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8f9fa; color: var(--primary-color); font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <header>
        <h1>校曆與每日教學課表管理系統</h1>
        <div class="subtitle">實時連結 Google Sheet (SOW & Timetable)</div>
    </header>

    <div class="controls">
        <div class="control-card">
            <label for="datePicker">選擇檢視日期：</label>
            <input type="date" id="datePicker">
        </div>
        <div class="control-card">
            <label>Google Sheet 資料同步狀態：</label>
            <div id="statusText" style="color: #e67e22; font-weight: bold; padding-top: 5px;">
                ⏳ 正在連線讀取 SOW 及 Timetable 工作表...
            </div>
        </div>
    </div>

    <!-- 當日課堂焦點 -->
    <div class="today-card">
        <div class="today-header">
            <div>
                <span class="today-date" id="displayDate">----年--月--日</span>
                <span style="font-size:0.9rem; margin-left:10px; opacity:0.8;" id="displayWeek">---</span>
            </div>
            <div class="cycle-badge" id="displayCycle">Day -</div>
        </div>

        <div>
            <div style="font-weight: bold; margin-bottom: 8px;">📌 當日課節安排 (Lessons Schedule)：</div>
            <div class="lessons-grid" id="lessonsContainer">
                <!-- 動態載入課節 -->
            </div>
        </div>
    </div>

    <!-- 分頁選單 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('timetableTab')">📅 課堂時間表 (Timetable)</button>
        <button class="tab-btn" onclick="switchTab('sowTab')">🗓️ 教學進度 / 校曆 (SOW)</button>
    </div>

    <div id="timetableTab" class="tab-content active">
        <h2>時間表總覽 (Timetable)</h2>
        <table id="timetableTable">
            <thead id="timetableHead"></thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

    <div id="sowTab" class="tab-content">
        <h2>教學進度總覽 (SOW)</h2>
        <table id="sowTable">
            <thead id="sowHead"></thead>
            <tbody id="sowBody"></tbody>
        </table>
    </div>

    <script>
        const SHEET_ID = '1ultOcsf8s4bFj7CrqyD_DlN4hOZ8ekK7ip4czQQl5Ms';
        const SOW_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=SOW`;
        const TIMETABLE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=timetable`;

        let sowData = [];
        let timetableData = [];

        window.onload = async () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;

            await loadAllData();

            document.getElementById('datePicker').addEventListener('change', (e) => {
                updateTodayView(e.target.value);
            });
        };

        // 解析 CSV 工具函式
        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            return lines.map(line => {
                const matches = [];
                let match;
                const reg = /(?:"([^"]*(?:""[^"]*)*)"|([^,"]*))/g;
                while ((match = reg.exec(line)) && match.index < line.length) {
                    if (match[1] !== undefined) {
                        matches.push(match[1].replace(/""/g, '"'));
                    } else {
                        matches.push(match[2]);
                    }
                }
                return matches;
            });
        }

        async function loadAllData() {
            try {
                const [sowRes, ttRes] = await Promise.all([
                    fetch(SOW_URL).then(r => r.text()),
                    fetch(TIMETABLE_URL).then(r => r.text())
                ]);

                sowData = parseCSV(sowRes);
                timetableData = parseCSV(ttRes);

                document.getElementById('statusText').textContent = "● 已成功讀取 SOW 與 Timetable 數據";
                document.getElementById('statusText').style.color = "#27ae60";

                renderTable('sowHead', 'sowBody', sowData);
                renderTable('timetableHead', 'timetableBody', timetableData);

                updateTodayView(document.getElementById('datePicker').value);
            } catch (err) {
                console.error(err);
                document.getElementById('statusText').textContent = "⚠️ 載入失敗！請確認 Google Sheet 已開啟「知道連結的人皆可檢視」權限";
                document.getElementById('statusText').style.color = "#c0392b";
            }
        }

        function renderTable(headId, bodyId, dataRows) {
            if (!dataRows || dataRows.length === 0) return;

            const headers = dataRows[0];
            const rows = dataRows.slice(1);

            document.getElementById(headId).innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
            document.getElementById(bodyId).innerHTML = rows.map(r => `<tr>${r.map(c => `<td>${c || ''}</td>`).join('')}</tr>`).join('');
        }

        function updateTodayView(dateStr) {
            if (sowData.length < 2) return;

            const headers = sowData[0].map(h => h.trim().toLowerCase());
            const dateIdx = headers.findIndex(h => h.includes('date') || h.includes('日期'));
            const weekIdx = headers.findIndex(h => h.includes('week') || h.includes('週') || h.includes('周'));
            const cycleIdx = headers.findIndex(h => h.includes('cycle') || h.includes('循環') || h.includes('day'));

            let matchedRow = null;
            if (dateIdx !== -1) {
                matchedRow = sowData.slice(1).find(r => r[dateIdx] && r[dateIdx].trim() === dateStr);
            }

            if (matchedRow) {
                document.getElementById('displayDate').textContent = dateStr;
                document.getElementById('displayWeek').textContent = weekIdx !== -1 ? matchedRow[weekIdx] : '';
                const currentCycle = cycleIdx !== -1 ? matchedRow[cycleIdx] : '';
                document.getElementById('displayCycle').textContent = currentCycle || '無';

                filterAndRenderLessons(currentCycle);
            } else {
                document.getElementById('displayDate').textContent = dateStr;
                document.getElementById('displayWeek').textContent = "非紀錄日期 / 假日";
                document.getElementById('displayCycle').textContent = "-";
                document.getElementById('lessonsContainer').innerHTML = '<div style="opacity:0.7;">當天無對應的校曆資料</div>';
            }
        }

        function filterAndRenderLessons(currentCycle) {
            if (!currentCycle || timetableData.length < 2) {
                document.getElementById('lessonsContainer').innerHTML = '<div style="opacity:0.7;">當天沒有排定的課節資訊</div>';
                return;
            }

            const ttHeaders = timetableData[0].map(h => h.trim().toLowerCase());
            const cycleIdx = ttHeaders.findIndex(h => h.includes('cycle') || h.includes('循環') || h.includes('day'));
            const periodIdx = ttHeaders.findIndex(h => h.includes('period') || h.includes('堂') || h.includes('節'));
            const classIdx = ttHeaders.findIndex(h => h.includes('class') || h.includes('班'));
            const subjectIdx = ttHeaders.findIndex(h => h.includes('subject') || h.includes('科'));
            const roomIdx = ttHeaders.findIndex(h => h.includes('room') || h.includes('地點') || h.includes('室'));
            const timeIdx = ttHeaders.findIndex(h => h.includes('time') || h.includes('時間'));

            const matchedLessons = timetableData.slice(1).filter(r => cycleIdx !== -1 && r[cycleIdx] && r[cycleIdx].trim().toLowerCase() === currentCycle.trim().toLowerCase());

            if (matchedLessons.length === 0) {
                document.getElementById('lessonsContainer').innerHTML = '<div style="opacity:0.7;">當天無課 (空堂 / 活動日)</div>';
                return;
            }

            document.getElementById('lessonsContainer').innerHTML = matchedLessons.map(l => `
                <div class="lesson-item">
                    <div class="lesson-time">${periodIdx !== -1 ? l[periodIdx] : ''} ${timeIdx !== -1 && l[timeIdx] ? '(' + l[timeIdx] + ')' : ''}</div>
                    <div class="lesson-main">${classIdx !== -1 ? l[classIdx] : ''} ${subjectIdx !== -1 ? '- ' + l[subjectIdx] : ''}</div>
                    <div class="lesson-room">📍 ${roomIdx !== -1 ? l[roomIdx] : '課室'}</div>
                </div>
            `).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
