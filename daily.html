<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Daily Rapid Log</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: #1e293b;
      margin: 0;
      padding: 10px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-btn {
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 6px;
      text-decoration: none;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }
    .nav-btn.active { background: var(--primary); color: #ffffff; }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 12px;
    }
    .date-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
    .date-ctrl { display: flex; gap: 4px; align-items: center; }
    .btn-sm {
      padding: 6px 10px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    input[type="date"], select {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .filter-box {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .add-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row-1, .input-row-2 { display: flex; gap: 6px; }
    .content-input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.88rem; }

    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-item.done { background: #f1f5f9; opacity: 0.75; }
    .log-item.done .log-text { text-decoration: line-through; color: #94a3b8; }
    .log-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .log-actions { display: flex; gap: 4px; align-items: center; }
    
    .badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-task { background: #e0e7ff; color: #4338ca; }
    .badge-event { background: #fef3c7; color: #b45309; }
    .badge-note { background: #f1f5f9; color: #475569; }
    .log-text { font-size: 0.9rem; font-weight: 500; }

    .status-btn, .edit-btn {
      padding: 5px 8px;
      font-size: 0.78rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }
    .status-btn.todo { background: #fee2e2; color: #dc2626; }
    .status-btn.done { background: #dcfce7; color: #15803d; }
    .edit-btn { background: #f1f5f9; color: #475569; }

    /* Modal 彈窗樣式 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #fff; padding: 18px; border-radius: 12px; width: 90%; max-width: 400px;
      display: flex; flex-direction: column; gap: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="navbar" class="nav-tabs"></div>

    <div class="date-bar">
      <div class="date-title">📝 Rapid Log</div>
      <div class="date-ctrl">
        <button class="btn-sm" onclick="changeDate(-1)">◀</button>
        <input type="date" id="datePicker" onchange="onDateChange()">
        <button class="btn-sm" onclick="changeDate(1)">▶</button>
        <button class="btn-sm btn-primary" onclick="goToday()">今天</button>
      </div>
    </div>

    <div class="filter-box">
      <input type="checkbox" id="showDoneToggle" checked onchange="renderLogs()">
      <label for="showDoneToggle">顯示已完成事項</label>
    </div>

    <form class="add-card" onsubmit="handleAddLog(event)">
      <div class="input-row-1">
        <select id="logType">
          <option value="Task">• 任務</option>
          <option value="Event">○ 事件</option>
          <option value="Note">- 便條</option>
        </select>
        <select id="logEmoji">
          <option value="">無 Emoji</option>
          <option value="⚡">⚡ 快速</option>
          <option value="📌">📌 重要</option>
          <option value="🛒">🛒 購物</option>
          <option value="🔍">🔍 研究</option>
          <option value="📞">📞 聯絡</option>
          <option value="💡">💡 靈感</option>
        </select>
      </div>
      <div class="input-row-2">
        <input type="text" id="logContent" class="content-input" placeholder="記下事項或筆記..." required>
        <button type="submit" class="btn-sm btn-primary" style="padding: 0 14px;">新增</button>
      </div>
    </form>

    <div id="loading" style="font-size:0.85rem; color:#6366f1; margin-bottom:10px; font-weight:bold;">⏳ 正在載入 Daily Log...</div>
    <div id="logList" class="log-list"></div>
  </div>

  <!-- 編輯 Modal 彈窗 -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3 style="margin:0; font-size:1.05rem;">✏️ 編輯事項</h3>
      <label style="font-size:0.82rem; font-weight:bold;">日期：</label>
      <input type="date" id="editDate">
      
      <label style="font-size:0.82rem; font-weight:bold;">種類：</label>
      <select id="editType">
        <option value="Task">任務 Task</option>
        <option value="Event">事件 Event</option>
        <option value="Note">便條 Note</option>
      </select>

      <label style="font-size:0.82rem; font-weight:bold;">內容：</label>
      <input type="text" id="editContent" class="content-input">

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="btn-sm" onclick="closeEditModal()">取消</button>
        <button class="btn-sm btn-primary" onclick="saveEdit()">儲存更新</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_ID = CONFIG.DAILY_SHEET_ID;
    const LOGS_GID = CONFIG.GIDS.DAILY_LOG;
    const API_URL = CONFIG.API_URLS.DAILY;
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${LOGS_GID}&t=${new Date().getTime()}`;

    let currentDate = new Date().toISOString().split('T')[0];
    let allLogs = [];
    let currentEditIndex = -1;

    window.onload = () => {
      loadNavbar();
      document.getElementById('datePicker').value = currentDate;
      loadData();
    };

    function loadNavbar() {
      fetch('nav.html')
        .then(res => res.text())
        .then(data => {
          const navContainer = document.getElementById('navbar');
          if (navContainer) {
            navContainer.innerHTML = data;
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            navContainer.querySelectorAll('.nav-btn').forEach(link => {
              if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });
          }
        }).catch(err => console.log('導覽列載入失敗:', err));
    }

    function loadData() {
      Papa.parse(CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (res) => {
          allLogs = res.data || [];
          document.getElementById('loading').style.display = 'none';
          renderLogs();
        }
      });
    }

    function renderLogs() {
      const listContainer = document.getElementById('logList');
      const showDone = document.getElementById('showDoneToggle').checked;
      listContainer.innerHTML = '';

      const dayLogs = allLogs.filter(item => (item.Date || item.date) === currentDate);

      if (dayLogs.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px; font-size:0.85rem;">今天尚無記錄</div>';
        return;
      }

      dayLogs.forEach((item) => {
        const realIndex = allLogs.indexOf(item);
        const type = item.Type || item.type || 'Task';
        const content = item.Content || item.content || item.Text || '';
        const status = item.Status || item.status || 'Pending';
        const isDone = status === 'Done' || status === '已完成';

        if (!showDone && isDone) return;

        const card = document.createElement('div');
        card.className = `log-item ${isDone ? 'done' : ''}`;

        let typeBadge = `<span class="badge badge-task">任務</span>`;
        if (type === 'Event' || type === '事件') typeBadge = `<span class="badge badge-event">事件</span>`;
        if (type === 'Note' || type === '便條') typeBadge = `<span class="badge badge-note">便條</span>`;

        let actionBtnHtml = '';
        if (type !== 'Note' && type !== '便條') {
          actionBtnHtml = `
            <button class="status-btn ${isDone ? 'done' : 'todo'}" onclick="toggleStatus('${item.ID || ''}', '${status}', ${realIndex})">
              ${isDone ? '✓ 完成' : '⏳ 待辦'}
            </button>
          `;
        }

        card.innerHTML = `
          <div class="log-left">
            ${typeBadge}
            <span class="log-text">${content}</span>
          </div>
          <div class="log-actions">
            <button class="edit-btn" onclick="openEditModal(${realIndex})">✏️</button>
            ${actionBtnHtml}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    /* 開啟與關閉編輯 Modal */
    function openEditModal(index) {
      currentEditIndex = index;
      const target = allLogs[index];
      document.getElementById('editDate').value = target.Date || target.date || currentDate;
      document.getElementById('editType').value = target.Type || target.type || 'Task';
      document.getElementById('editContent').value = target.Content || target.content || '';
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
      currentEditIndex = -1;
    }

    /* 儲存修改 */
    function saveEdit() {
      if (currentEditIndex === -1) return;

      const newDate = document.getElementById('editDate').value;
      const newType = document.getElementById('editType').value;
      const newContent = document.getElementById('editContent').value.trim();

      // 1. 本地更新
      allLogs[currentEditIndex].Date = newDate;
      allLogs[currentEditIndex].Type = newType;
      allLogs[currentEditIndex].Content = newContent;

      closeEditModal();
      renderLogs();

      // 2. 背景更新至 Google Sheet
      const rowIndex = currentEditIndex + 2;
      const updateUrl = `${API_URL}?action=updateLog&row=${rowIndex}&date=${encodeURIComponent(newDate)}&type=${encodeURIComponent(newType)}&content=${encodeURIComponent(newContent)}`;
      
      fetch(updateUrl, { mode: 'no-cors' });
    }

    function toggleStatus(id, currentStatus, realIndex) {
      const isDone = currentStatus === 'Done' || currentStatus === '已完成';
      const newStatus = isDone ? 'Pending' : 'Done';

      if (allLogs[realIndex]) {
        allLogs[realIndex].Status = newStatus;
        allLogs[realIndex].status = newStatus;
      }

      renderLogs();

      const rowIndex = realIndex + 2;
      const updateUrl = `${API_URL}?action=toggleLog&id=${encodeURIComponent(id)}&status=${encodeURIComponent(newStatus)}&row=${rowIndex}`;
      fetch(updateUrl, { mode: 'no-cors' });
    }

    function handleAddLog(e) {
      e.preventDefault();
      const type = document.getElementById('logType').value;
      const emoji = document.getElementById('logEmoji').value;
      const rawContent = document.getElementById('logContent').value.trim();
      
      const fullContent = emoji ? `${emoji} ${rawContent}` : rawContent;
      const newId = 'L' + new Date().getTime();

      allLogs.push({ Date: currentDate, Type: type, Content: fullContent, Status: 'Pending', ID: newId });
      renderLogs();
      document.getElementById('logContent').value = '';

      fetch(`${API_URL}?action=addLog&date=${currentDate}&type=${type}&content=${encodeURIComponent(fullContent)}&id=${newId}`, { mode: 'no-cors' });
    }

    function changeDate(days) {
      const d = new Date(currentDate);
      d.setDate(d.getDate() + days);
      currentDate = d.toISOString().split('T')[0];
      document.getElementById('datePicker').value = currentDate;
      renderLogs();
    }

    function goToday() {
      currentDate = new Date().toISOString().split('T')[0];
      document.getElementById('datePicker').value = currentDate;
      renderLogs();
    }

    function onDateChange() {
      currentDate = document.getElementById('datePicker').value;
      renderLogs();
    }
  </script>
</body>
</html>
