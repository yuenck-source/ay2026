<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Daily Rapid Log</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: #1e293b;
      margin: 0;
      padding: 10px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* 動態導覽列容器 */
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-btn {
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 6px;
      text-decoration: none;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }
    .nav-btn.active { background: var(--primary); color: #ffffff; }

    /* 日期控制列 */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 12px;
    }
    .date-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
    }
    .date-ctrl {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn-sm {
      padding: 6px 10px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    input[type="date"] {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* 快捷切換濾鏡 */
    .filter-box {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 輸入區塊 */
    .add-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row-1 {
      display: flex;
      gap: 6px;
    }
    .type-select, .emoji-select {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      background: #fff;
    }
    .input-row-2 {
      display: flex;
      gap: 6px;
    }
    .content-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }

    /* 事項清單列表 */
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-item.done { background: #f1f5f9; opacity: 0.75; }
    .log-item.done .log-text { text-decoration: line-through; color: #94a3b8; }
    .log-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-task { background: #e0e7ff; color: #4338ca; }
    .badge-event { background: #fef3c7; color: #b45309; }
    .badge-note { background: #f1f5f9; color: #475569; }
    .log-text { font-size: 0.9rem; font-weight: 500; }

    .status-btn {
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }
    .status-btn.todo { background: #fee2e2; color: #dc2626; }
    .status-btn.done { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 動態導覽列容器 -->
    <div id="navbar" class="nav-tabs"></div>

    <!-- 2. 精簡日期控制列 -->
    <div class="date-bar">
      <div class="date-title">📝 Rapid Log</div>
      <div class="date-ctrl">
        <button class="btn-sm" onclick="changeDate(-1)">◀</button>
        <input type="date" id="datePicker" onchange="onDateChange()">
        <button class="btn-sm" onclick="changeDate(1)">▶</button>
        <button class="btn-sm btn-primary" onclick="goToday()">今天</button>
      </div>
    </div>

    <div class="filter-box">
      <input type="checkbox" id="showDoneToggle" checked onchange="renderLogs()">
      <label for="showDoneToggle">顯示已完成項目</label>
    </div>

    <!-- 3. 新增事項區塊 (可選 Emoji + 分類) -->
    <form class="add-card" onsubmit="handleAddLog(event)">
      <div class="input-row-1">
        <select id="logType" class="type-select">
          <option value="Task">• 任務</option>
          <option value="Event">○ 事件</option>
          <option value="Note">- 便條</option>
        </select>
        <select id="logEmoji" class="emoji-select">
          <option value="">無 Emoji</option>
          <option value="⚡">⚡ 快速</option>
          <option value="📌">📌 重要</option>
          <option value="🛒">🛒 購物</option>
          <option value="🔍">🔍 研究</option>
          <option value="📞">📞 聯絡</option>
          <option value="💡">💡 靈感</option>
        </select>
      </div>
      <div class="input-row-2">
        <input type="text" id="logContent" class="content-input" placeholder="記下事項或筆記..." required>
        <button type="submit" class="btn-sm btn-primary" style="padding: 0 14px;">新增</button>
      </div>
    </form>

    <!-- 4. 事項列表 -->
    <div id="logList" class="log-list"></div>
  </div>

  <script>
    const GOOGLE_SHEET_ID = '1q3NLPoGG8qr33knDt6REdLM8-GVrarzSercPLrjKSbo';
    const LOGS_GID = '0'; // 請依據試算表設定對應的 GID
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${LOGS_GID}&t=${new Date().getTime()}`;
    const API_URL = 'https://script.google.com/macros/s/AKfycbz72-QL780wO-NVLsszPusQN3WGqCCeb-vn0yZEI8I6dgGwFaawpJtbUATozrE631rE/exec';

    let currentDate = new Date().toISOString().split('T')[0];
    let allLogs = [];

    window.onload = () => {
      loadNavbar();
      document.getElementById('datePicker').value = currentDate;
      loadData();
    };

    /* 動態載入導覽列並標示當前頁面 */
    function loadNavbar() {
      fetch('nav.html')
        .then(res => res.text())
        .then(data => {
          const navContainer = document.getElementById('navbar');
          if (navContainer) {
            navContainer.innerHTML = data;
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            navContainer.querySelectorAll('.nav-btn').forEach(link => {
              if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });
          }
        }).catch(err => console.log('載入導覽列失敗:', err));
    }

    function loadData() {
      Papa.parse(CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (res) => {
          allLogs = res.data || [];
          renderLogs();
        }
      });
    }

    function renderLogs() {
      const listContainer = document.getElementById('logList');
      const showDone = document.getElementById('showDoneToggle').checked;
      listContainer.innerHTML = '';

      const dayLogs = allLogs.filter(item => {
        const itemDate = item.Date || item.date;
        return itemDate === currentDate;
      });

      if (dayLogs.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px; font-size:0.85rem;">今天沒有任何紀錄</div>';
        return;
      }

      dayLogs.forEach((item, index) => {
        const type = item.Type || 'Task';
        const content = item.Content || item.Text || '';
        const status = item.Status || 'Pending';
        const isDone = status === 'Done';

        if (!showDone && isDone) return;

        const card = document.createElement('div');
        card.className = `log-item ${isDone ? 'done' : ''}`;

        let typeBadge = `<span class="badge badge-task">任務</span>`;
        if (type === 'Event') typeBadge = `<span class="badge badge-event">事件</span>`;
        if (type === 'Note') typeBadge = `<span class="badge badge-note">便條</span>`;

        // 便條不顯示完成/待辦按鈕
        let actionBtnHtml = '';
        if (type !== 'Note') {
          actionBtnHtml = `
            <button class="status-btn ${isDone ? 'done' : 'todo'}" onclick="toggleStatus('${item.ID || index}', '${status}')">
              ${isDone ? '✓ 完成' : '⏳ 待辦'}
            </button>
          `;
        }

        card.innerHTML = `
          <div class="log-left">
            ${typeBadge}
            <span class="log-text">${content}</span>
          </div>
          ${actionBtnHtml}
        `;
        listContainer.appendChild(card);
      });
    }

    /* 新增事項（自動結合 Emoji） */
    function handleAddLog(e) {
      e.preventDefault();
      const type = document.getElementById('logType').value;
      const emoji = document.getElementById('logEmoji').value;
      const rawContent = document.getElementById('logContent').value.trim();
      
      const fullContent = emoji ? `${emoji} ${rawContent}` : rawContent;
      const newId = 'L' + new Date().getTime();

      allLogs.push({ Date: currentDate, Type: type, Content: fullContent, Status: 'Pending', ID: newId });
      renderLogs();
      document.getElementById('logContent').value = '';

      fetch(`${API_URL}?action=addLog&date=${currentDate}&type=${type}&content=${encodeURIComponent(fullContent)}&id=${newId}`, { mode: 'no-cors' });
    }

    function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === 'Done' ? 'Pending' : 'Done';
      const target = allLogs.find(l => (l.ID || l.id) === id);
      if (target) target.Status = newStatus;
      renderLogs();

      fetch(`${API_URL}?action=toggleLog&id=${id}&status=${newStatus}`, { mode: 'no-cors' });
    }

    /* 日期操作 */
    function changeDate(days) {
      const d = new Date(currentDate);
      d.setDate(d.getDate() + days);
      currentDate = d.toISOString().split('T')[0];
      document.getElementById('datePicker').value = currentDate;
      renderLogs();
    }

    function goToday() {
      currentDate = new Date().toISOString().split('T')[0];
      document.getElementById('datePicker').value = currentDate;
      renderLogs();
    }

    function onDateChange() {
      currentDate = document.getElementById('datePicker').value;
      renderLogs();
    }
  </script>
</body>
</html>
