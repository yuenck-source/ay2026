<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Rapid Log - Daily</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --primary-color: #6366f1;
      --bg-color: #f8fafc;
      --border-color: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-btn {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 6px;
      text-decoration: none;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
    }
    .nav-btn.active { background: var(--primary-color); color: #ffffff; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-color);
      font-size: 1.25rem;
      font-weight: bold;
    }
    .date-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .date-input {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-weight: bold;
    }
    .today-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #statusMessage {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .filter-box {
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #475569;
    }

    .input-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .select-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .select-group select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-weight: bold;
      background: #fff;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .add-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .log-item.done { opacity: 0.6; }
    .log-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      white-space: nowrap;
    }
    .badge.task, .badge.Task { background: #e0e7ff; color: #3730a3; }
    .badge.event, .badge.Event { background: #fef3c7; color: #92400e; }
    .badge.note, .badge.Note { background: #f1f5f9; color: #475569; }

    .action-btns { display: flex; gap: 6px; align-items: center; }
    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
    }
    .btn-danger {
      color: #ef4444;
      border-color: #fca5a5;
    }
    .btn-danger:hover {
      background: #fef2f2;
    }
    .status-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .status-btn.done { background: #dcfce7; color: #15803d; }
    .status-btn.todo { background: #fee2e2; color: #b91c1c; }

    /* 1. 當日工作框：淺綠色 */
    .today-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .today-title {
      font-size: 1rem;
      font-weight: bold;
      color: #166534;
      margin-bottom: 10px;
    }

    /* 逾期框：淺紅色 */
    .overdue-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }
    .overdue-title {
      color: #991b1b;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    /* 3. 將來事項框：淺藍色 */
    .future-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }
    .future-title {
      color: #0369a1;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .collapsible-content {
      margin-top: 10px;
    }

    /* 2. 手機版優化：螢幕寬度小於 600px 時隱藏按鈕文字，僅保留 Icon */
    @media (max-width: 600px) {
      .btn-text {
        display: none;
      }
      .btn-sm {
        padding: 6px 8px;
      }
    }

    /* Modal 樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: #1e293b;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-weight: bold;
      font-size: 0.9rem;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
    }
    .btn-cancel { background: #f1f5f9; color: #475569; }
    .btn-save { background: var(--primary-color); color: #ffffff; }
  </style>
</head>
<body>

  <div class="container">
    <div id="navbar" class="nav-tabs"></div>

    <div class="header-bar">
      <div class="title-group">
        <span>⚡ Rapid Log</span>
      </div>
      <div class="date-controls">
        <button class="icon-btn" onclick="changeDate(-1)">◀</button>
        <input type="date" id="currentDate" class="date-input" onchange="handleDateChange()">
        <button class="icon-btn" onclick="changeDate(1)">▶</button>
        <button class="today-btn" onclick="jumpToToday()">今天</button>
      </div>
    </div>

    <div id="statusMessage">⏳ 載入資料中...</div>

    <div class="filter-box">
      <input type="checkbox" id="showCompleted" checked onchange="renderAll()">
      <label for="showCompleted">顯示已完成事項</label>
    </div>

    <form class="input-card" onsubmit="handleLogSubmit(event)">
      <div class="select-group">
        <select id="logType">
          <option value="Task">• 任務 (Task)</option>
          <option value="Event">o 事件 (Event)</option>
          <option value="筆記">- 筆記</option>
        </select>
        <select id="logEmoji">
          <option value="">無 Emoji</option>
          <option value="📌">📌 釘選</option>
          <option value="📍">📍 地點</option>
          <option value="💡">💡 想法</option>
          <option value="🏫">🏫 學校</option>
          <option value="📐">📐 數學</option>
          <option value="📝">📝 筆記</option>
          <option value="📧">📧 電郵</option>
          <option value="📞">📞 電話</option>
          <option value="🛒">🛒 購物</option>
          <option value="⚠️">⚠️ 緊急</option>
          <option value="⏳">⏳ 待辦</option>
          <option value="🎯">🎯 目標</option>
          <option value="🔥">🔥 重要</option>
        </select>
      </div>
      <div class="input-group">
        <input type="text" id="logContent" placeholder="記下事項或筆記..." required>
        <button type="submit" class="add-btn">新增</button>
      </div>
    </form>

    <!-- 1. 當日工作卡片（淺綠色框） -->
    <div class="today-box">
      <div class="today-title">📌 當日工作與筆記</div>
      <div id="dailyList" class="log-list"></div>
    </div>

    <!-- 4. 可收合 Overdue 區塊 -->
    <div class="overdue-box">
      <div class="overdue-title" onclick="toggleSection('overdueContent', 'overdueArrow')">
        <span>⚠️ 待處理及逾期工作 (Overdue)</span>
        <span id="overdueArrow">▼</span>
      </div>
      <div id="overdueContent" class="collapsible-content">
        <div id="overdueList" class="log-list"></div>
      </div>
    </div>

    <!-- 3 & 4. 可收合 Future 區塊 -->
    <div class="future-box">
      <div class="future-title" onclick="toggleSection('futureContent', 'futureArrow')">
        <span>📅 將來預定事項 (Future)</span>
        <span id="futureArrow">▼</span>
      </div>
      <div id="futureContent" class="collapsible-content">
        <div id="futureList" class="log-list"></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">✏️ 編輯事項</div>
      <input type="hidden" id="modalTargetId">
      <input type="hidden" id="modalOldContent">
      
      <div class="form-group">
        <label>日期：</label>
        <input type="date" id="modalDate">
      </div>
      <div class="form-group">
        <label>種類：</label>
        <select id="modalType">
          <option value="Task">Task (任務)</option>
          <option value="Event">Event (事件)</option>
          <option value="筆記">筆記</option>
        </select>
      </div>
      <div class="form-group">
        <label>內容：</label>
        <input type="text" id="modalContent">
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn btn-save" onclick="saveModalEdit()">儲存更新</button>
      </div>
    </div>
  </div>

  <script>
    let allLogs = [];

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let currentDateStr = getTodayString();

    window.onload = () => {
      loadNavbar();
      document.getElementById('currentDate').value = currentDateStr;

      if (typeof CONFIG === 'undefined') {
        showStatus('❌ 找不到 config.js 設定', '#ef4444');
        return;
      }

      loadLogsData();
    };

    function showStatus(text, color = '#6366f1') {
      const msg = document.getElementById('statusMessage');
      msg.style.color = color;
      msg.textContent = text;
    }

    function loadNavbar() {
      fetch('nav.html')
        .then(res => res.text())
        .then(data => {
          const navContainer = document.getElementById('navbar');
          if (navContainer) {
            navContainer.innerHTML = data;
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            navContainer.querySelectorAll('.nav-btn').forEach(link => {
              if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });
          }
        })
        .catch(err => console.log('導覽列載入失敗', err));
    }

    function loadLogsData() {
      const sheetId = CONFIG.DAILY_SHEET_ID;
      const gid = CONFIG.GIDS.DAILY_LOG;

      if (!sheetId) {
        showStatus('❌ config.js 中缺少 DAILY_SHEET_ID', '#ef4444');
        return;
      }

      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}&t=${new Date().getTime()}`;

      Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          allLogs = parseLogs(results.data);
          showStatus('');
          renderAll();
        },
        error: () => {
          showStatus('❌ 讀取失敗，請確認 Google Sheet 已設定公開權限', '#ef4444');
        }
      });
    }

    function parseLogs(rows) {
      if (!rows) return [];
      return rows.map((r, i) => {
        const v = Object.values(r);
        return {
          id: r.ID || r.id || v[0] || `L_${i}`,
          date: r.Date || r.date || v[1] || currentDateStr,
          type: r.Type || r.type || v[2] || 'Task',
          content: r.Content || r.content || v[3] || '',
          status: r.Status || r.status || v[4] || 'Pending'
        };
      });
    }

    function jumpToToday() {
      currentDateStr = getTodayString();
      document.getElementById('currentDate').value = currentDateStr;
      renderAll();
    }

    function changeDate(days) {
      const d = new Date(currentDateStr);
      d.setDate(d.getDate() + days);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      currentDateStr = `${year}-${month}-${day}`;
      document.getElementById('currentDate').value = currentDateStr;
      renderAll();
    }

    function handleDateChange() {
      currentDateStr = document.getElementById('currentDate').value;
      renderAll();
    }

    function renderAll() {
      renderDailyLogs();
      renderOverdue();
      renderFuture();
    }

    function isItemDone(status) {
      return status === '完成' || status === 'Done';
    }

    /* 折疊/收合控制 */
    function toggleSection(contentId, arrowId) {
      const content = document.getElementById(contentId);
      const arrow = document.getElementById(arrowId);
      if (content.style.display === 'none') {
        content.style.display = 'block';
        arrow.textContent = '▼';
      } else {
        content.style.display = 'none';
        arrow.textContent = '▶';
      }
    }

    function renderDailyLogs() {
      const container = document.getElementById('dailyList');
      container.innerHTML = '';

      const showCompleted = document.getElementById('showCompleted').checked;
      const currentLogs = allLogs.filter(item => {
        if (item.date !== currentDateStr) return false;
        if (!showCompleted && isItemDone(item.status)) return false;
        return true;
      });

      if (currentLogs.length === 0) {
        container.innerHTML = '<div style="color:#64748b; font-size:0.9rem; text-align:center; padding:12px;">當日無任何紀錄項目</div>';
        return;
      }

      currentLogs.forEach(item => {
        container.appendChild(createLogElement(item, false));
      });
    }

    function renderOverdue() {
      const container = document.getElementById('overdueList');
      container.innerHTML = '';
      const todayStr = getTodayString();

      const overdueItems = allLogs.filter(item => !isItemDone(item.status) && item.date < todayStr);

      if (overdueItems.length === 0) {
        container.innerHTML = '<div style="color:#059669; font-size:0.85rem;">✅ 目前沒有逾期的待辦事項</div>';
        return;
      }

      overdueItems.forEach(item => {
        container.appendChild(createLogElement(item, true));
      });
    }

    /* 渲染將來事項 */
    function renderFuture() {
      const container = document.getElementById('futureList');
      container.innerHTML = '';
      const todayStr = getTodayString();

      const showCompleted = document.getElementById('showCompleted').checked;
      const futureItems = allLogs.filter(item => {
        if (item.date <= todayStr) return false;
        if (!showCompleted && isItemDone(item.status)) return false;
        return true;
      });

      if (futureItems.length === 0) {
        container.innerHTML = '<div style="color:#0284c7; font-size:0.85rem;">📅 目前沒有將來預定事項</div>';
        return;
      }

      futureItems.forEach(item => {
        container.appendChild(createLogElement(item, true));
      });
    }

    function createLogElement(item, showDateTag) {
      const isDone = isItemDone(item.status);
      const div = document.createElement('div');
      div.className = `log-item ${isDone ? 'done' : ''}`;

      let badgeClass = 'task';
      if (item.type === '事件' || item.type === 'Event') badgeClass = 'event';
      if (item.type === '筆記' || item.type === 'Note') badgeClass = 'note';

      div.innerHTML = `
        <div class="log-left">
          <span class="badge ${badgeClass}">${item.type}</span>
          <span>${item.content} ${showDateTag ? `<small style="color:#64748b;">(${item.date})</small>` : ''}</span>
        </div>
        <div class="action-btns">
          <button class="btn-sm" onclick="openModal('${item.id}')">✏️<span class="btn-text"> 編輯</span></button>
          <button class="btn-sm btn-danger" onclick="deleteLog('${item.id}')">🗑️<span class="btn-text"> 刪除</span></button>
          <button class="status-btn ${isDone ? 'done' : 'todo'}" onclick="toggleStatus('${item.id}', '${item.status}', '${item.date}', '${encodeURIComponent(item.content)}')">
            ${isDone ? '✓ 完成' : '⏳ 待辦'}
          </button>
        </div>
      `;
      return div;
    }

    function openModal(id) {
      const target = allLogs.find(l => l.id === id);
      if (!target) return;

      document.getElementById('modalTargetId').value = target.id;
      document.getElementById('modalOldContent').value = target.content;
      
      document.getElementById('modalDate').value = target.date;
      document.getElementById('modalType').value = target.type;
      document.getElementById('modalContent').value = target.content;

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveModalEdit() {
      const id = document.getElementById('modalTargetId').value;
      const oldContent = document.getElementById('modalOldContent').value;

      const newDate = document.getElementById('modalDate').value;
      const newType = document.getElementById('modalType').value;
      const newContent = document.getElementById('modalContent').value.trim();

      if (!newContent) return;

      const target = allLogs.find(l => l.id === id);
      if (target) {
        target.date = newDate;
        target.type = newType;
        target.content = newContent;
      }

      closeModal();
      renderAll();

      showStatus('⏳ 正在同步更新至 Google Sheet...');
      const apiUrl = CONFIG.API_URLS.DAILY;
      if (apiUrl) {
        const params = new URLSearchParams({
          action: 'editLog',
          id: id,
          oldContent: oldContent,
          date: newDate,
          type: newType,
          content: newContent
        });

        fetch(`${apiUrl}?${params.toString()}`, { mode: 'no-cors' })
          .then(() => showStatus(''))
          .catch(() => showStatus('❌ 更新寫入失敗', '#ef4444'));
      }
    }

    function deleteLog(id) {
      if (!confirm('確定要刪除這筆事項嗎？')) return;

      const targetIndex = allLogs.findIndex(l => l.id === id);
      if (targetIndex === -1) return;

      const target = allLogs[targetIndex];
      allLogs.splice(targetIndex, 1);
      renderAll();

      showStatus('⏳ 正在從 Google Sheet 刪除...');
      const apiUrl = CONFIG.API_URLS.DAILY;
      if (apiUrl) {
        const params = new URLSearchParams({
          action: 'deleteLog',
          id: id,
          content: target.content
        });
        fetch(`${apiUrl}?${params.toString()}`, { mode: 'no-cors' })
          .then(() => showStatus(''))
          .catch(() => showStatus('❌ 刪除寫入失敗', '#ef4444'));
      }
    }

    function toggleStatus(id, currentStatus, date, content) {
      const isDone = isItemDone(currentStatus);
      const newStatus = isDone ? 'Pending' : '完成';
      
      const target = allLogs.find(l => l.id === id);
      if (target) target.status = newStatus;

      renderAll();

      const apiUrl = CONFIG.API_URLS.DAILY;
      if (apiUrl) {
        const params = new URLSearchParams({
          action: 'toggleLog',
          id: id,
          date: date,
          content: decodeURIComponent(content),
          status: newStatus
        });
        fetch(`${apiUrl}?${params.toString()}`, { mode: 'no-cors' });
      }
    }

    function handleLogSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('logType').value;
      const emoji = document.getElementById('logEmoji').value;
      let rawContent = document.getElementById('logContent').value.trim();

      if (!rawContent) return;

      const finalContent = emoji ? `${emoji} ${rawContent}` : rawContent;
      const newId = 'L' + new Date().getTime();

      allLogs.push({
        id: newId,
        date: currentDateStr,
        type: type,
        content: finalContent,
        status: 'Pending'
      });

      document.getElementById('logContent').value = '';
      renderAll();

      const apiUrl = CONFIG.API_URLS.DAILY;
      if (apiUrl) {
        const params = new URLSearchParams({
          action: 'addLog',
          id: newId,
          date: currentDateStr,
          type: type,
          content: finalContent,
          status: 'Pending'
        });
        fetch(`${apiUrl}?${params.toString()}`, { mode: 'no-cors' });
      }
    }
  </script>
</body>
</html>
