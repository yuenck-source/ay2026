<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Daily Log 速記簿</title>

  <!-- PapaParse 用於解析 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- 載入全站統一設定 -->
  <script src="config.js"></script>

  <style>
    :root {
      --primary-color: #166534;
      --bg-color: #f8fafc;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      margin: 0;
      padding: 8px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* 頁籤導覽列 */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-btn {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 6px;
      text-decoration: none;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { background: #cbd5e1; }
    .nav-btn.active { background: #2563eb; color: #ffffff; }

    /* 控制與新增區域 */
    .action-card {
      background: #f0fdf4;
      border: 1px solid #86efac;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 140px 100px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .form-grid input[type="text"] {
        grid-column: span 2;
      }
      .form-grid button {
        grid-column: span 2;
      }
    }

    input, select, button {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .btn-add {
      background: var(--primary-color);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .btn-add:hover { opacity: 0.9; }

    /* 篩選工具列 */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-color);
    }

    /* Hashtag 標籤列 */
    .hashtag-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 6px 10px;
      background: #f1f5f9;
      border-radius: 6px;
      align-items: center;
    }

    .tag-btn {
      padding: 2px 8px;
      font-size: 0.78rem;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      cursor: pointer;
      font-weight: 500;
    }
    .tag-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      font-weight: bold;
    }

    /* 清單項目 */
    .daily-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .daily-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .daily-item.done {
      opacity: 0.55;
      background: #f8fafc;
    }

    .daily-main {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .daily-text {
      font-size: 0.9rem;
      line-height: 1.4;
      color: #0f172a;
      word-break: break-word;
    }

    /* Badge 標籤 */
    .badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      white-space: nowrap;
    }
    .badge.task, .badge.Task { background: #e0e7ff; color: #3730a3; }
    .badge.event, .badge.Event { background: #fef3c7; color: #92400e; }
    .badge.note, .badge.Note, .badge.筆記 { background: #f1f5f9; color: #475569; }

    /* 內文 Hashtag 點擊樣式 */
    .hashtag-link {
      color: #2563eb;
      background-color: #eff6ff;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
    }
    .hashtag-link:hover {
      background-color: #dbeafe;
      text-decoration: underline;
    }

    .btn-icon-only {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon-only.done { background: #dcfce7; border-color: #86efac; color: #15803d; }
    .btn-icon-only.todo { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }

    #loading { font-size: 0.88rem; color: #166534; font-weight: bold; padding: 12px 0; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 導覽選單 (載入 nav.html) -->
    <div id="navbar" class="nav-tabs"></div>

    <!-- ⚡ 快速新增區塊 -->
    <div class="action-card">
      <form id="addForm" onsubmit="handleAddLog(event)" class="form-grid">
        <input type="date" id="inputDate" required>
        <select id="inputType">
          <option value="Task">Task 任務</option>
          <option value="Event">Event 事件</option>
          <option value="Note">Note 筆記</option>
        </select>
        <input type="text" id="inputContent" placeholder="輸入內容...支援 #Hashtag (例如: #備課 準備教材)" required>
        <button type="submit" class="btn-add">➕ 新增</button>
      </form>
    </div>

    <!-- 🔍 篩選條件欄位 -->
    <div class="filter-bar">
      <label style="font-size: 0.85rem; font-weight: bold;">📅 日期篩選：</label>
      <select id="filterDateMode" onchange="applyFilters()">
        <option value="all">全部紀錄</option>
        <option value="today" selected>僅顯示今天</option>
      </select>

      <label style="font-size: 0.85rem; font-weight: bold; margin-left: 8px;">🏷️ 類別：</label>
      <select id="filterType" onchange="applyFilters()">
        <option value="all">全部</option>
        <option value="Task">Task 任務</option>
        <option value="Event">Event 事件</option>
        <option value="Note">Note 筆記</option>
      </select>

      <label style="font-size: 0.85rem; font-weight: bold; margin-left: 8px;">📌 狀態：</label>
      <select id="filterStatus" onchange="applyFilters()">
        <option value="all">全部</option>
        <option value="pending" selected>未完成</option>
        <option value="done">已完成</option>
      </select>
    </div>

    <!-- 🏷️ Hashtag 快速篩選 Bar -->
    <div id="hashtagBar" class="hashtag-bar">
      <span style="font-size: 0.8rem; font-weight: bold; color: #475569;"># 標籤篩選：</span>
      <div id="tagContainer" style="display:flex; gap:4px; flex-wrap:wrap;"></div>
    </div>

    <div id="loading">⏳ 載入速記資料中...</div>

    <!-- 📋 清單呈現區塊 -->
    <div id="dailyList" class="daily-list"></div>
  </div>

  <script>
    // 設定檔變數
    const GOOGLE_SHEET_ID = (typeof CONFIG !== 'undefined' && CONFIG.DAILY_SHEET_ID) ? CONFIG.DAILY_SHEET_ID : '';
    const DAILY_GID = (typeof CONFIG !== 'undefined' && CONFIG.GIDS && CONFIG.GIDS.DAILY_LOG) ? CONFIG.GIDS.DAILY_LOG : '0';
    const API_URL = (typeof CONFIG !== 'undefined' && CONFIG.API_URLS) ? CONFIG.API_URLS.DAILY : '';

    const DAILY_CSV_URL = GOOGLE_SHEET_ID ? `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${DAILY_GID}&t=${new Date().getTime()}` : '';

    let dailyRows = [];
    let selectedTag = 'all';

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    const todayStr = getTodayString();

    window.addEventListener('DOMContentLoaded', () => {
      loadNavbar();
      document.getElementById('inputDate').value = todayStr;
      loadDailyLog();
    });

    function loadNavbar() {
      fetch('nav.html')
        .then(res => res.text())
        .then(data => {
          const navContainer = document.getElementById('navbar');
          if (navContainer) {
            navContainer.innerHTML = data;
            const currentPath = window.location.pathname.split('/').pop() || 'daily.html';
            navContainer.querySelectorAll('.nav-btn').forEach(link => {
              if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });
          }
        }).catch(err => console.log('導覽列載入失敗:', err));
    }

    /* 日期格式轉換 */
    function normalizeDateStr(dateStr) {
      if (!dateStr) return '';
      let cleaned = dateStr.toString().trim().replace(/\//g, '-').replace(/\./g, '-');
      const parts = cleaned.split('-');
      if (parts.length === 3) {
        let y = parts[0].trim();
        if (y.length === 2) y = '20' + y;
        const m = parts[1].trim().padStart(2, '0');
        const d = parts[2].trim().padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return cleaned;
    }

    /* 自動提煉 Hashtag 陣列 */
    function extractHashtags(text) {
      if (!text) return [];
      const matches = text.match(/#([\u4e00-\u9fa5\w_]+)/g);
      return matches ? matches.map(tag => tag.substring(1)) : [];
    }

    /* 將文字內的 #Hashtag 轉化為可點擊 span */
    function formatContentWithTags(text) {
      if (!text) return '';
      return text.replace(/#([\u4e00-\u9fa5\w_]+)/g, '<span class="hashtag-link" onclick="filterByTag(\'$1\')">#$1</span>');
    }

    /* 讀取 CSV */
    function loadDailyLog() {
      if (!DAILY_CSV_URL) {
        document.getElementById('loading').textContent = '❌ 未設定 GIDS.DAILY_LOG';
        return;
      }

      Papa.parse(DAILY_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (res) => {
          document.getElementById('loading').style.display = 'none';
          if (res.data) {
            dailyRows = res.data.map((r, i) => {
              const v = Object.values(r);
              const content = r.Content || r.content || v[3] || '';
              const remarks = r.Remarks || r.remarks || v[5] || '';
              const combinedText = content + ' ' + remarks;

              return {
                id: r.ID || r.id || v[0] || `L_${i}`,
                parsedDate: normalizeDateStr(r.Date || r.date || v[1] || ''),
                parsedType: r.Type || r.type || v[2] || 'Task',
                parsedContent: content,
                parsedStatus: r.Status || r.status || v[4] || 'Pending',
                parsedRemarks: remarks,
                tags: extractHashtags(combinedText) // 💡 自動解析 Hashtags
              };
            });

            renderHashtagBar();
            applyFilters();
          }
        },
        error: (err) => {
          console.error("載入失敗:", err);
          document.getElementById('loading').textContent = '⚠️ 資料讀取失敗，請檢查權限設定。';
        }
      });
    }

    /* 動態產生 Hashtag 篩選按鈕 */
    function renderHashtagBar() {
      const tagContainer = document.getElementById('tagContainer');
      if (!tagContainer) return;

      const tagMap = {};
      dailyRows.forEach(r => {
        r.tags.forEach(t => {
          tagMap[t] = (tagMap[t] || 0) + 1;
        });
      });

      const uniqueTags = Object.keys(tagMap);
      if (uniqueTags.length === 0) {
        document.getElementById('hashtagBar').style.display = 'none';
        return;
      }

      document.getElementById('hashtagBar').style.display = 'flex';
      let html = `<button class="tag-btn ${selectedTag === 'all' ? 'active' : ''}" onclick="filterByTag('all')">全部</button>`;
      
      uniqueTags.forEach(t => {
        html += `<button class="tag-btn ${selectedTag === t ? 'active' : ''}" onclick="filterByTag('${t}')">#${t} (${tagMap[t]})</button>`;
      });

      tagContainer.innerHTML = html;
    }

    /* 標籤篩選觸發 */
    function filterByTag(tag) {
      selectedTag = tag;
      renderHashtagBar();
      applyFilters();
    }

    /* 綜合條件過濾與渲染 */
    function applyFilters() {
      const dateMode = document.getElementById('filterDateMode').value;
      const typeMode = document.getElementById('filterType').value;
      const statusMode = document.getElementById('filterStatus').value;

      const filtered = dailyRows.filter(r => {
        // 1. 日期過濾
        if (dateMode === 'today' && r.parsedDate !== todayStr) return false;

        // 2. 類別過濾
        if (typeMode !== 'all' && r.parsedType.toLowerCase() !== typeMode.toLowerCase()) return false;

        // 3. 狀態過濾
        const isDone = (r.parsedStatus === 'Done' || r.parsedStatus === '完成' || r.parsedStatus === '已完成');
        if (statusMode === 'pending' && isDone) return false;
        if (statusMode === 'done' && !isDone) return false;

        // 4. Hashtag 標籤過濾
        if (selectedTag !== 'all' && !r.tags.includes(selectedTag)) return false;

        return true;
      });

      renderDailyList(filtered);
    }

    /* 渲染列表 */
    function renderDailyList(items) {
      const container = document.getElementById('dailyList');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#64748b; padding: 20px 0; font-size: 0.9rem;">沒有符合條件的速記事項。</div>`;
        return;
      }

      items.forEach(item => {
        const isDone = (item.parsedStatus === 'Done' || item.parsedStatus === '完成' || item.parsedStatus === '已完成');
        const formattedContent = formatContentWithTags(item.parsedContent);
        const formattedRemarks = formatContentWithTags(item.parsedRemarks);

        let badgeClass = 'task';
        if (item.parsedType === '事件' || item.parsedType === 'Event') badgeClass = 'event';
        if (item.parsedType === '筆記' || item.parsedType === 'Note') badgeClass = 'note';

        const div = document.createElement('div');
        div.className = `daily-item ${isDone ? 'done' : ''}`;

        div.innerHTML = `
          <div class="daily-main">
            <span class="badge ${badgeClass}">${item.parsedType}</span>
            <div style="display:flex; flex-direction:column; gap: 2px;">
              <span class="daily-text">${formattedContent}</span>
              ${item.parsedRemarks ? `<span style="font-size:0.78rem; color:#64748b;">💬 ${formattedRemarks}</span>` : ''}
              <span style="font-size:0.72rem; color:#94a3b8; margin-top:2px;">📅 ${item.parsedDate}</span>
            </div>
          </div>
          <button class="btn-icon-only ${isDone ? 'done' : 'todo'}" 
                  onclick="toggleDailyStatus('${item.id}', '${item.parsedStatus}', '${item.parsedDate}', '${encodeURIComponent(item.parsedContent)}')" 
                  title="${isDone ? '標記為未完成' : '標記為已完成'}">
            ${isDone ? '✓' : '⏳'}
          </button>
        `;

        container.appendChild(div);
      });
    }

    /* 切換完成狀態 */
    function toggleDailyStatus(id, currentStatus, date, content) {
      const isDone = (currentStatus === 'Done' || currentStatus === '完成' || currentStatus === '已完成');
      const newStatus = isDone ? 'Pending' : '完成';

      const target = dailyRows.find(r => r.id === id);
      if (target) {
        target.parsedStatus = newStatus;
        applyFilters();
      }

      if (API_URL) {
        const params = new URLSearchParams({
          action: 'toggleLog',
          id: id,
          date: date,
          content: decodeURIComponent(content),
          status: newStatus
        });
        fetch(`${API_URL}?${params.toString()}`, { mode: 'no-cors' });
      }
    }

    /* 新增項目 */
    function handleAddLog(e) {
      e.preventDefault();
      const date = document.getElementById('inputDate').value;
      const type = document.getElementById('inputType').value;
      const content = document.getElementById('inputContent').value.trim();

      if (!content) return;

      const newObj = {
        id: `L_${Date.now()}`,
        parsedDate: date,
        parsedType: type,
        parsedContent: content,
        parsedStatus: 'Pending',
        parsedRemarks: '',
        tags: extractHashtags(content)
      };

      dailyRows.unshift(newObj);
      document.getElementById('inputContent').value = '';
      
      renderHashtagBar();
      applyFilters();

      if (API_URL) {
        const params = new URLSearchParams({
          action: 'addLog',
          date: date,
          type: type,
          content: content,
          status: 'Pending'
        });
        fetch(`${API_URL}?${params.toString()}`, { mode: 'no-cors' });
      }
    }
  </script>
</body>
</html>
