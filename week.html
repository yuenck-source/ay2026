<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗓️ 週安排檢視 - 2026-2027 Dashboard</title>

  <!-- PapaParse 用於高效率解析 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

 <style>
  :root {
    --primary-color: #2563eb;
    --timetable-color: #0284c7;
    --pm-timetable-color: #0d9488;
    --math-color: #0d9488;
    --sow-color: #7c3aed;
    --ft-color: #ea580c;
    --duty-color: #ea580c;
    --bg-color: #f8fafc;
    --border-color: #cbd5e1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: #1e293b;
    margin: 0;
    padding: 8px;
  }

  .container {
    max-width: 1150px;
    margin: 0 auto;
    background: #ffffff;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    box-sizing: border-box;
    overflow: hidden;
  }

  /* 頁籤導覽列 (多頁面超連結模式) */
  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .nav-tabs::-webkit-scrollbar { display: none; }

  .nav-btn {
    padding: 8px 14px;
    font-size: 0.88rem;
    border-radius: 6px;
    text-decoration: none;
    background: #e2e8f0;
    color: #475569;
    font-weight: bold;
    transition: all 0.2s ease;
  }

  .nav-btn:hover { background: #cbd5e1; }
  .nav-btn.active { background: var(--primary-color); color: #ffffff; }

  select, button {
    padding: 6px 8px;
    font-size: 0.85rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background-color: #fff;
    cursor: pointer;
  }

  .btn-nav {
    padding: 5px 10px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  .btn-secondary { background-color: #0284c7; color: white; border: none; }

  /* 週檢視區塊 */
  .week-section {
    background-color: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .week-section-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }

  @media (min-width: 640px) {
    .week-section-header {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
  }

  .week-section-title {
    font-size: 1rem;
    font-weight: bold;
    color: #0369a1;
    margin: 0;
    white-space: nowrap;
  }

  .week-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
  }

  @media (min-width: 640px) {
    .week-controls {
      width: auto;
    }
  }

  #weekSelect {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 0.88rem;
    padding: 6px;
  }

  .week-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }

  .week-card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .week-card.is-weekend { background-color: #fafafa; border-color: #e2e8f0; }

  .week-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed #e2e8f0;
    padding-bottom: 6px;
  }

  .week-card-date { font-weight: bold; font-size: 0.88rem; color: #334155; }
  .week-card-weekday { font-size: 0.78rem; color: #64748b; }
  .week-card-weekday.weekend-text { color: #e11d48; font-weight: bold; }

  .week-tt-box {
    margin-top: 4px;
    padding-top: 2px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* 晨間活動卡片 */
  .morning-item {
    background-color: #fff7ed !important;
    border-left: 3px solid #f97316 !important;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 0.78rem;
    line-height: 1.3;
    border-bottom: 1px dashed #ffedd5;
  }

  /* 上午課堂項目卡片 */
  .week-tt-item {
    background-color: #f0f9ff;
    border-left: 3px solid var(--timetable-color);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 0.78rem;
    line-height: 1.3;
    border-bottom: 1px dashed #cbd5e1;
  }

  /* 下午課堂項目卡片 */
  .week-tt-item-pm {
    background-color: #f0fdf4;
    border-left: 3px solid var(--pm-timetable-color);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 0.78rem;
    line-height: 1.3;
    border-bottom: 1px dashed #bbf7d0;
  }

  /* Duty 專屬橙色風格 */
  .duty-item {
    background-color: #fff7ed !important;
    border-left: 3px solid var(--duty-color) !important;
    color: #9a3412;
    font-size: 0.75rem;
    padding: 4px 6px;
    border-radius: 4px;
    font-weight: 600;
    border-bottom: 1px dashed #fdba74;
  }

  /* 各時段分隔標示線 */
  .section-divider {
    margin-top: 4px;
    margin-bottom: 2px;
    padding: 3px 6px;
    font-size: 0.72rem;
    font-weight: bold;
    border-radius: 4px;
    text-align: center;
  }

  .divider-morning {
    background-color: #ffedd5;
    color: #c2410c;
    border: 1px dashed #fed7aa;
  }

  .divider-am {
    background-color: #e0f2fe;
    color: #0369a1;
    border: 1px dashed #bae6fd;
  }

  .divider-pm {
    background-color: #dcfce7;
    color: #15803d;
    border: 1px dashed #86efac;
  }

  .week-tt-period { font-weight: bold; color: #0284c7; }
  .week-tt-period-pm { font-weight: bold; color: #0d9488; }
  .week-tt-class { font-weight: bold; color: #ea580c; }
  .week-tt-subject { font-weight: bold; color: #0f172a; display: block; margin-top: 1px; }
  .week-tt-room { color: #64748b; font-size: 0.7rem; }

  .badge-cycle { background: #2563eb; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.72rem; }
  
  .holiday-tag {
    background-color: #ffe4e6;
    color: #9f1239;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 4px;
    border-left: 3px solid #f43f5e;
    margin-top: 3px;
  }

  .activity-tag {
    background-color: #fef3c7;
    color: #92400e;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 4px;
    border-left: 3px solid #f59e0b;
    margin-top: 3px;
  }

  #loading {
    font-size: 0.88rem;
    color: #0284c7;
    font-weight: bold;
    padding: 8px 0;
  }

  @media (max-width: 480px) {
    .btn-text { display: none; }
    .btn-nav { padding: 5px 8px; }
  }
</style>
</head>
<body>

  <div class="container">
    <!-- 多頁面導覽列 -->
    <!-- 在各頁面中 (例如 habit.html) -->
	<div id="navbar" class="nav-tabs"></div>

    <!-- 週檢視內容區塊 -->
    <div id="weekSection" class="week-section">
      <div class="week-section-header">
        <div class="week-section-title">🗓️ 週安排檢視</div>
        <div class="week-controls">
          <button class="btn-nav btn-secondary" onclick="changeWeek(-1)">◀<span class="btn-text"> 上一週</span></button>
          <select id="weekSelect" onchange="onWeekSelectChange()"></select>
          <button class="btn-nav btn-secondary" onclick="changeWeek(1)"><span class="btn-text">下一週 </span>▶</button>
        </div>
      </div>
      
      <div id="loading">⏳ 載入校曆與時間表資料中...</div>
      <div id="weekCards" class="week-cards-grid"></div>
    </div>
  </div>

<script>
    const CSV_URL = 'Sch Calendar-Grid view.csv';
    const GOOGLE_SHEET_ID = '1ultOcsf8s4bFj7CrqyD_DlN4hOZ8ekK7ip4czQQl5Ms';
    const TIMETABLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=timetable&t=${new Date().getTime()}`;

    let calendarData = {}; 
    let availableDatesSorted = [];
    let allWeeks = [];
    let currentWeekIndex = 0;
    let timetableRows = [];

    window.addEventListener('DOMContentLoaded', () => {
      // 1. 讀取校曆 CSV
      Papa.parse(CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (results) => {
          processData(results.data);
          document.getElementById('loading').style.display = 'none';
        }
      });

      // 2. 讀取 Google Sheets 時間表資料
      loadTimetable();
    });

    function normalizeRowObject(row) {
      const newRow = {};
      Object.keys(row).forEach(key => {
        const cleanKey = key.trim().toLowerCase().replace(/[\_\s]/g, '');
        newRow[cleanKey] = row[key];
        newRow[key.trim()] = row[key];
      });
      return newRow;
    }

    function getValueFromRow(row, candidateKeys) {
      for (let k of candidateKeys) {
        const cleanK = k.toLowerCase().replace(/[\_\s]/g, '');
        if (row[cleanK] !== undefined && row[cleanK] !== null && String(row[cleanK]).trim() !== '') {
          return String(row[cleanK]).trim();
        }
      }
      return '';
    }

    function loadTimetable() {
      Papa.parse(TIMETABLE_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: res => {
          if (res.data && res.data.length > 0) {
            timetableRows = res.data.map(r => normalizeRowObject(r));
            if (allWeeks.length > 0) renderWeekCards(currentWeekIndex);
          }
        }
      });
    }

    function processData(rows) {
      const dateList = [];
      rows.forEach(row => {
        if (!row.Date) return;
        const parts = row.Date.split('/');
        if (parts.length === 3) {
          const formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          calendarData[formattedDate] = row;
          dateList.push({ dateStr: formattedDate, rawRow: row, dt: new Date(formattedDate) });
        }
      });
      dateList.sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      availableDatesSorted = dateList;

      parseAllWeeks(); 
    }

    function parseAllWeeks() {
      allWeeks = [];
      if (availableDatesSorted.length === 0) return;

      let currentWeekDays = [];
      let weekCounter = 1;

      availableDatesSorted.forEach((item, idx) => {
        currentWeekDays.push(item);
        const dayOfWeek = item.dt.getDay();

        if (dayOfWeek === 0 || idx === availableDatesSorted.length - 1) {
          const startDate = currentWeekDays[0].dateStr;
          const endDate = currentWeekDays[currentWeekDays.length - 1].dateStr;
          
          const startM = parseInt(startDate.split('-')[1]);
          const startD = parseInt(startDate.split('-')[2]);
          const endM = parseInt(endDate.split('-')[1]);
          const endD = parseInt(endDate.split('-')[2]);

          allWeeks.push({
            label: `第 ${weekCounter} 週 (${startM}/${startD} - ${endM}/${endD})`,
            startDate: startDate,
            endDate: endDate,
            days: currentWeekDays
          });
          weekCounter++;
          currentWeekDays = [];
        }
      });

      const select = document.getElementById('weekSelect'); 
      select.innerHTML = '';
      allWeeks.forEach((w, idx) => {
        const opt = document.createElement('option'); 
        opt.value = idx; 
        opt.textContent = w.label;
        select.appendChild(opt);
      });

      if (allWeeks.length > 0) {
        const todayStr = new Date().toISOString().split('T')[0];
        let targetIndex = 0;

        let matchedIndex = allWeeks.findIndex(w => todayStr >= w.startDate && todayStr <= w.endDate);

        if (matchedIndex !== -1) {
          targetIndex = matchedIndex;
        } else {
          let futureIndex = allWeeks.findIndex(w => w.startDate > todayStr);
          if (futureIndex !== -1) {
            targetIndex = futureIndex;
          } else {
            targetIndex = allWeeks.length - 1;
          }
        }

        currentWeekIndex = targetIndex;
        if (select) select.value = currentWeekIndex;

        renderWeekCards(currentWeekIndex);
      }
    }

    function formatTimeString(str) {
      if (!str) return '';
      let s = String(str).trim();
      return s.replace(/\b(\d{2})(\d{2})\b/g, '$1:$2');
    }

    function getStartMinutes(tStr) {
      if (!tStr) return 9999;
      const match = String(tStr).match(/(\d{1,2}):?(\d{2})/);
      if (match) {
        const hrs = parseInt(match[1], 10);
        const mins = parseInt(match[2], 10);
        return hrs * 60 + mins;
      }
      return 9999;
    }

    function normalizeWeekday(str) {
      if (!str) return '';
      const s = String(str).trim().toLowerCase();
      if (s.includes('mon') || s.includes('一')) return 'mon';
      if (s.includes('tue') || s.includes('二')) return 'tue';
      if (s.includes('wed') || s.includes('三')) return 'wed';
      if (s.includes('thu') || s.includes('四')) return 'thu';
      if (s.includes('fri') || s.includes('五')) return 'fri';
      return s;
    }

    function getTimetableForDay(cycleDay, weekday) {
      if (!timetableRows || !Array.isArray(timetableRows) || timetableRows.length === 0) {
        return [];
      }

      const targetCycle = String(cycleDay || '').trim().toLowerCase();
      const targetWeek = normalizeWeekday(weekday);

      return timetableRows.filter(row => {
        if (!row) return false;
        const rowDay = getValueFromRow(row, ['cycle', '循環日', 'day', 'weekday', '星期']).toLowerCase();
        const normalizedRowDay = normalizeWeekday(rowDay);

        const matchCycle = targetCycle && (rowDay === targetCycle);
        const matchWeek = targetWeek && (normalizedRowDay === targetWeek);

        return matchCycle || matchWeek;
      });
    }

    function renderWeekCards(idx) {
      try {
        const container = document.getElementById('weekCards'); 
        if (!container) return;
        container.innerHTML = '';

        if (!allWeeks || !allWeeks[idx]) return;
        
        const weekSelect = document.getElementById('weekSelect');
        if (weekSelect) weekSelect.value = idx;

        allWeeks[idx].days.forEach(item => {
          if (!item) return;

          const row = item.rawRow || {};
          const dateParts = String(item.dateStr || '').split('-');
          const m = dateParts[1] ? parseInt(dateParts[1], 10) : '';
          const d = dateParts[2] ? parseInt(dateParts[2], 10) : '';
          
          const dayOfWeek = item.dt ? item.dt.getDay() : 0;
          const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
          const cycleDay = String(row['Cycle Day'] || '').trim();
          const weekday = String(row['Weekday'] || '').trim();

          const normalizedDayKey = normalizeWeekday(weekday);
          const hasCycle = Boolean(cycleDay && cycleDay !== '-' && cycleDay.toLowerCase() !== 'null');

          let combinedTimeline = [];

          if (hasCycle) {
            const isFri = (normalizedDayKey === 'fri' || dayOfWeek === 5);
            const matchedTT = getTimetableForDay(cycleDay, weekday);

            if (matchedTT.length > 0) {
              matchedTT.forEach(tt => {
                if (!tt) return;

                const periodRaw = getValueFromRow(tt, ['period', '課節', '節數']);
                
                let rawTime = '';
                if (isFri) {
                  rawTime = getValueFromRow(tt, ['timefri', 'time_fri', 'fri']) || getValueFromRow(tt, ['timemonthu', 'time_monthu', 'time']);
                } else {
                  rawTime = getValueFromRow(tt, ['timemonthu', 'time_monthu', 'time']) || getValueFromRow(tt, ['timefri', 'time_fri']);
                }
                const time = formatTimeString(rawTime);

                const className = getValueFromRow(tt, ['class', '班別']);
                const subject = getValueFromRow(tt, ['subject', '科目']);
                const room = getValueFromRow(tt, ['room', '地點', '課室']);

                const breakDuty = getValueFromRow(tt, ['breakduty', '小息當值']);
                const playDuty = getValueFromRow(tt, ['playtimeduty', 'playduty', '大息當值']);
                const lunchDuty = getValueFromRow(tt, ['lunchduty', '午膳當值', '看飯當值']);
                const lunchPlayDuty = getValueFromRow(tt, ['lunchplaytimeduty', 'lunchplayduty', '午膳小息當值']);
                const dismissalDuty = getValueFromRow(tt, ['dismissalduty', '放學當值']);
                const ecaDuty = getValueFromRow(tt, ['ecaduty', 'eca當值']);
                const ecaDismissalDuty = getValueFromRow(tt, ['ecadismissalduty', 'eca放學當值']);

                if (breakDuty) combinedTimeline.push({ type: 'duty', label: '☕ 小息當值', duty: breakDuty, time, rawTime: rawTime || '09:40' });
                if (playDuty) combinedTimeline.push({ type: 'duty', label: '🛝 大息當值', duty: playDuty, time, rawTime: rawTime || '10:30' });
                if (lunchDuty) combinedTimeline.push({ type: 'duty', label: '🍱 午膳看飯', duty: lunchDuty, time, rawTime: rawTime || '12:00' });
                if (lunchPlayDuty) combinedTimeline.push({ type: 'duty-lunchplay', label: '🏃 午小當值', duty: lunchPlayDuty, time, rawTime: rawTime || '12:40' });
                if (dismissalDuty) combinedTimeline.push({ type: 'duty-pm', label: '🏫 放學當值', duty: dismissalDuty, time, rawTime: rawTime || '15:15' });
                if (ecaDuty) combinedTimeline.push({ type: 'duty-pm', label: '🎨 ECA 當值', duty: ecaDuty, time, rawTime: rawTime || '15:30' });
                if (ecaDismissalDuty) combinedTimeline.push({ type: 'duty-pm', label: '🚌 ECA 放學當值', duty: ecaDismissalDuty, time, rawTime: rawTime || '16:30' });

                const cleanSubject = (subject && subject !== '-') ? subject : '';
                const cleanClass = (className && className !== '-') ? className : '';

                const startMins = getStartMinutes(rawTime);
                const isMorningSlot = (startMins < 500) || periodRaw.includes('晨') || periodRaw.toLowerCase().includes('check-in') || periodRaw.toLowerCase().includes('ceremony');

                if (cleanSubject || cleanClass) {
                  if (isMorningSlot) {
                    combinedTimeline.push({
                      type: 'morning', time, className: cleanClass, subject: cleanSubject, room: (room && room !== '-') ? room : '', rawTime
                    });
                  } else {
                    let periodLabel = periodRaw;
                    if (/^\d+$/.test(periodRaw.trim())) periodLabel = `Period ${periodRaw.trim()}`;

                    combinedTimeline.push({ 
                      type: 'lesson', period: periodLabel, time, className: cleanClass, subject: cleanSubject, room: (room && room !== '-') ? room : '', rawTime
                    });
                  }
                }
              });
            }

            combinedTimeline.sort((a, b) => getStartMinutes(a.rawTime) - getStartMinutes(b.rawTime));
          }

          let ttHtml = '';
          if (hasCycle && combinedTimeline.length > 0) {
            ttHtml = `<div class="week-tt-box">`;
            let hasShownMorningDivider = false, hasShownAMDivider = false, hasShownPMDivider = false;

            combinedTimeline.forEach(item => {
              const mins = getStartMinutes(item.rawTime);

              if (!hasShownMorningDivider && (item.type === 'morning' || mins < 500)) {
                ttHtml += `<div class="section-divider divider-morning">🌅 晨間活動</div>`;
                hasShownMorningDivider = true;
              }
              if (!hasShownAMDivider && mins >= 500 && mins < 780) {
                ttHtml += `<div class="section-divider divider-am">📚 上午課堂</div>`;
                hasShownAMDivider = true;
              }
              if (!hasShownPMDivider && (mins >= 780 || item.type === 'duty-lunchplay' || item.type === 'duty-pm')) {
                ttHtml += `<div class="section-divider divider-pm">👇 下午課堂 / 活動</div>`;
                hasShownPMDivider = true;
              }

              if (item.type === 'morning') {
                ttHtml += `
                  <div class="morning-item">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
                      <span style="font-weight:bold; color:#c2410c; font-size: 0.72rem; background: #ffedd5; padding: 1px 5px; border-radius: 3px;">${item.time}</span>
                      ${item.className ? `<span class="week-tt-class">${item.className}</span>` : ''}
                    </div>
                    <div style="margin-top: 3px;">
                      <span class="week-tt-subject" style="color:#9a3412;">${item.subject}</span>
                      ${item.room ? `<span class="week-tt-room">📍 ${item.room}</span>` : ''}
                    </div>
                  </div>
                `;
              } else if (item.type.startsWith('duty')) {
                const timeTag = item.time ? `<span style="opacity: 0.85; font-size: 0.7rem; font-weight: normal; margin-left: 4px;">(${item.time})</span>` : '';
                ttHtml += `<div class="duty-item">${item.label}${timeTag}：${item.duty}</div>`;
              } else {
                const isPM = mins >= 780;
                const cardStyleClass = isPM ? 'week-tt-item-pm' : 'week-tt-item';
                const periodStyleClass = isPM ? 'week-tt-period-pm' : 'week-tt-period';

                ttHtml += `
                  <div class="${cardStyleClass}">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
                      <div>
                        <span class="${periodStyleClass}">${item.period}</span>
                        ${item.time ? `<span style="font-size: 0.72rem; color: ${isPM ? '#0d9488' : '#0284c7'}; background: ${isPM ? '#e6fffa' : '#e0f2fe'}; padding: 1px 4px; border-radius: 3px; font-weight: 500; margin-left: 2px;">${item.time}</span>` : ''}
                      </div>
                      <span class="week-tt-class">${item.className}</span>
                    </div>
                    <div style="margin-top: 2px;">
                      <span class="week-tt-subject">${item.subject}</span>
                      ${item.room ? `<span class="week-tt-room">📍 ${item.room}</span>` : ''}
                    </div>
                  </div>
                `;
              }
            });
            ttHtml += `</div>`;
          }

          const card = document.createElement('div');
          card.className = `week-card ${isWeekend ? 'is-weekend' : ''}`;
          card.innerHTML = `
            <div class="week-card-header">
              <div>
                <span class="week-card-date">${m}月${d}日</span>
                <span class="week-card-weekday ${isWeekend ? 'weekend-text' : ''}">(${weekday || ''})</span>
              </div>
              ${cycleDay ? `<span class="badge-cycle">${cycleDay}</span>` : ''}
            </div>
            ${row['Sch Holiday/Special Sch Day'] ? `<div class="holiday-tag">🚩 ${row['Sch Holiday/Special Sch Day']}</div>` : ''}
            ${row['Special Activity'] ? `<div class="activity-tag">⭐ ${row['Special Activity']}</div>` : ''}
            ${ttHtml}
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("渲染週檢視時發生錯誤:", err);
      }
    }

    function onWeekSelectChange() {
      currentWeekIndex = parseInt(document.getElementById('weekSelect').value) || 0;
      renderWeekCards(currentWeekIndex);
    }

    function changeWeek(d) {
      let n = currentWeekIndex + d;
      if (n >= 0 && n < allWeeks.length) {
        currentWeekIndex = n;
        renderWeekCards(n);
      }
    }

  // 自動動態載入導覽列並標示目前頁面
  fetch('nav.html')
    .then(response => response.text())
    .then(data => {
      const navContainer = document.getElementById('navbar');
      if (navContainer) {
        navContainer.innerHTML = data;
        
        // 取得目前頁面檔名 (例如 "habit.html")
        const currentPath = window.location.pathname.split('/').pop() || 'index.html';
        
        // 自動尋找對應連結並加入 active class
        const links = navContainer.querySelectorAll('.nav-btn');
        links.forEach(link => {
          if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
          }
        });
      }
    });
  </script>

</body>
</html>
